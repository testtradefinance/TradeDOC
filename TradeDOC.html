window.addKeywordFromDetail = function() {
  const input = document.getElementById('keyword-extract-input');
  if (!input || !input.value.trim()) return;

  const keyword = input.value.trim().toLowerCase();
  if (keyword.length < 2) return;

  const doc = window.appStore.documents.find(d => d.id === window.currentDocId);
  if (!doc) return;
  const page = doc.pages.find(p => p.pageNum === window.activePageNum);
  if (!page || page.classification.typeId === 'unclassified') return;

  const dt = window.appStore.training.documentTypes.find(d => d.id === page.classification.typeId);
  if (!dt) return;

  // Check for duplicate
  if (dt.keywords.includes(keyword)) {
    showDetailKeywordMsg('warning', '"' + keyword + '" is already a keyword for ' + dt.name);
    input.value = '';
    return;
  }

  // Add keyword and save
  dt.keywords.push(keyword);
  saveStore(window.appStore);

  // Update the pills display without full re-render
  const pillsContainer = document.getElementById('detail-keyword-pills');
  if (pillsContainer) {
    const pill = document.createElement('span');
    pill.className = 'inline-flex items-center px-2 py-0.5 rounded-full text-[10px] bg-green-50 text-green-700 border border-green-200 fade-in';
    pill.textContent = keyword;
    pillsContainer.appendChild(pill);
    setTimeout(() => {
      pill.className = 'inline-flex items-center px-2 py-0.5 rounded-full text-[10px] bg-brand-50 text-brand-700 border border-brand-100';
    }, 2000);
  }

  showDetailKeywordMsg('success', '"' + keyword + '" added to ' + dt.name + '!');
  input.value = '';
};

function showDetailKeywordMsg(type, text) {
  const c = document.getElementById('detail-keyword-message');
  if (!c) return;
  const colors = { success: 'bg-green-50 text-green-700', warning: 'bg-yellow-50 text-yellow-700', error: 'bg-red-50 text-red-700' };
  c.innerHTML = '<div class="flex items-center gap-1.5 py-1.5 px-2 rounded text-[10px] ' + (colors[type] || colors.success) + ' fade-in">' + text + '</div>';

}

window.saveNewExtractedField = function(fieldType) {
  const labelInput = document.getElementById('new-field-label');
  const valueInput = document.getElementById('new-field-value');
  if (!labelInput || !valueInput) return;
  const label = labelInput.value.trim();
  let value = valueInput.value.trim();
  if (!label) { labelInput.focus(); return; }
  if (!value) { valueInput.focus(); return; }

  // Validate date fields
  if (label.toLowerCase().includes('date') || label.toLowerCase().includes('expiry')) {
    if (!isValidDate(value)) {
      valueInput.style.borderColor = '#ef4444';
      valueInput.setAttribute('title', 'Please enter a valid date (DD/MM/YYYY, YYYY-MM-DD, or DD Mon YYYY)');
      valueInput.focus();
      setTimeout(() => { valueInput.style.borderColor = ''; }, 3000);
      return;
    }
  }

  // For amount type, prepend currency and append unit
  if (fieldType === 'amount') {
    const currSel = document.getElementById('new-field-currency');
    const unitInput = document.getElementById('new-field-unit');
    const currency = currSel ? currSel.value : '';
    const unit = unitInput ? unitInput.value.trim() : '';
    value = (currency ? currency + ' ' : '') + value + (unit ? ' ' + unit : '');
  }

  const doc = window.appStore.documents.find(d => d.id === window.currentDocId);
  if (!doc) return;
  const page = doc.pages.find(p => p.pageNum === window.activePageNum);
  if (!page) return;
  if (!page.extractedData) page.extractedData = {};

  const key = 'manual_' + Date.now();
  page.extractedData[key] = { label: label, value: value };

  // Add corresponding noun
  if (!page.nouns) page.nouns = [];
  const category = FIELD_TO_NOUN_CATEGORY[key] || 'number';
  page.nouns.push({
    id: 'ne_' + Date.now() + '_m',
    text: value,
    category: category,
    source: 'extracted',
    extractedField: label
  });

  saveStore(window.appStore);
  renderDocumentDetail(document.getElementById('main-content'));
};

window.editExtractedField = function(tdEl, fieldKey) {
  const doc = window.appStore.documents.find(d => d.id === window.currentDocId);
  if (!doc) return;
  const page = doc.pages.find(p => p.pageNum === window.activePageNum);
  if (!page || !page.extractedData || !page.extractedData[fieldKey]) return;

  const currentValue = page.extractedData[fieldKey].value;
  const span = tdEl.querySelector('.editable-value');
  if (!span) return;

  // Replace span with input
  const input = document.createElement('input');
  input.type = 'text';
  input.value = typeof currentValue === 'string' ? currentValue : JSON.stringify(currentValue);
  input.className = 'w-full px-2 py-1 border border-brand-400 rounded text-xs font-semibold text-gray-900 focus:ring-2 focus:ring-brand-500 outline-none bg-white';

  span.replaceWith(input);
  input.focus();
  input.select();

  // Hide pencil icon
  const svg = tdEl.querySelector('svg');
  if (svg) svg.style.display = 'none';

  let saved = false;
  const save = () => {
    if (saved) return;
    saved = true;
    const newValue = input.value.trim();
    if (newValue !== '' && newValue !== String(currentValue)) {
      // Update extracted data
      page.extractedData[fieldKey].value = newValue;
      // Update corresponding noun if exists
      if (page.nouns) {
        const noun = page.nouns.find(n =>
          n.source === 'extracted' &&
          n.extractedField === page.extractedData[fieldKey].label &&
          n.text.trim().toLowerCase() === String(currentValue).trim().toLowerCase()
        );
        if (noun) noun.text = newValue;
      }
      saveStore(window.appStore);
    }
    renderDocumentDetail(document.getElementById('main-content'));
  };

  input.addEventListener('blur', save);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); save(); }
    if (e.key === 'Escape') { renderDocumentDetail(document.getElementById('main-content')); }
  });
};

function setupSelectionOverlay() {
  const wrapper = document.getElementById('pdf-canvas-wrapper');
  if (!wrapper) return;

  const overlay = document.createElement('div');
  overlay.id = 'noun-selection-overlay';
  overlay.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;cursor:crosshair;z-index:10;touch-action:none;';

  // Visual hint
  const hint = document.createElement('div');
  hint.style.cssText = 'position:absolute;top:8px;left:50%;transform:translateX(-50%);background:rgba(59,130,246,0.9);color:white;font-size:11px;padding:4px 12px;border-radius:6px;pointer-events:none;white-space:nowrap;z-index:11;';
  hint.textContent = 'Click and drag to select text';
  overlay.appendChild(hint);

  const rect = document.createElement('div');
  rect.id = 'selection-rect';
  rect.style.cssText = 'position:absolute;border:2px dashed #3b82f6;background:rgba(59,130,246,0.1);display:none;pointer-events:none;';
  overlay.appendChild(rect);

  overlay.addEventListener('pointerdown', onSelectionMouseDown);
  overlay.addEventListener('pointermove', onSelectionMouseMove);
  overlay.addEventListener('pointerup', onSelectionMouseUp);

  wrapper.appendChild(overlay);
  window._selectionOverlay = overlay;
  window._selectionRect = rect;
}

function removeSelectionOverlay() {
  if (window._selectionOverlay) {
    window._selectionOverlay.remove();
    window._selectionOverlay = null;
    window._selectionRect = null;
    window._selectionStart = null;
  }
  const picker = document.getElementById('noun-category-picker');
  if (picker) picker.remove();
}

function onSelectionMouseDown(e) {
  e.preventDefault();
  e.stopPropagation();
  // Remove any existing picker
  const picker = document.getElementById('noun-category-picker');
  if (picker) picker.remove();

  const overlay = window._selectionOverlay;
  try { overlay.setPointerCapture(e.pointerId); } catch(ex) {}
  const r = overlay.getBoundingClientRect();
  window._selectionStart = { x: e.clientX - r.left, y: e.clientY - r.top };
  const rect = window._selectionRect;
  rect.style.left = window._selectionStart.x + 'px';
  rect.style.top = window._selectionStart.y + 'px';
  rect.style.width = '0px';
  rect.style.height = '0px';
  rect.style.display = 'block';
}

function onSelectionMouseMove(e) {
  if (!window._selectionStart) return;
  e.preventDefault();
  const overlay = window._selectionOverlay;
  const r = overlay.getBoundingClientRect();
  const cx = e.clientX - r.left, cy = e.clientY - r.top;
  const rect = window._selectionRect;
  rect.style.left = Math.min(window._selectionStart.x, cx) + 'px';
  rect.style.top = Math.min(window._selectionStart.y, cy) + 'px';
  rect.style.width = Math.abs(cx - window._selectionStart.x) + 'px';
  rect.style.height = Math.abs(cy - window._selectionStart.y) + 'px';
}

function onSelectionMouseUp(e) {
  if (!window._selectionStart) return;
  e.preventDefault();
  const overlay = window._selectionOverlay;
  try { overlay.releasePointerCapture(e.pointerId); } catch(ex) {}
  const r = overlay.getBoundingClientRect();
  const ex = e.clientX - r.left, ey = e.clientY - r.top;
  const bounds = {
    x: Math.min(window._selectionStart.x, ex),
    y: Math.min(window._selectionStart.y, ey),
    w: Math.abs(ex - window._selectionStart.x),
    h: Math.abs(ey - window._selectionStart.y)
  };
  window._selectionStart = null;
  if (bounds.w < 3 || bounds.h < 3) { window._selectionRect.style.display = 'none'; return; }
  extractTextFromSelection(bounds);
}

async function extractTextFromSelection(displayBounds) {
  const canvas = document.getElementById('pdf-canvas');
  if (!canvas) return;
  const doc = window.appStore.documents.find(d => d.id === window.currentDocId);
  if (!doc) return;

  // Scale: canvas internal pixels vs displayed CSS pixels
  const cw = canvas.clientWidth || 1;
  const ch = canvas.clientHeight || 1;
  const displayScale = canvas.width / cw;

  // Convert selection from CSS pixels to canvas internal pixels
  const cb = {
    x: displayBounds.x * displayScale,
    y: displayBounds.y * displayScale,
    w: displayBounds.w * displayScale,
    h: displayBounds.h * displayScale
  };

  // Also compute selection as percentage of canvas for fallback method
  const selPct = {
    left: displayBounds.x / cw,
    top: displayBounds.y / ch,
    right: (displayBounds.x + displayBounds.w) / cw,
    bottom: (displayBounds.y + displayBounds.h) / ch
  };

  console.log('[SelectFromImage] Canvas internal:', canvas.width, 'x', canvas.height,
    'CSS:', cw, 'x', ch, 'displayScale:', displayScale.toFixed(3));
  console.log('[SelectFromImage] Selection CSS:', JSON.stringify(displayBounds));
  console.log('[SelectFromImage] Selection canvas:', JSON.stringify(cb));
  console.log('[SelectFromImage] Selection %:', JSON.stringify(selPct));

  try {
    let pdf;
    if (window._pdfCache.docId === doc.id && window._pdfCache.pdf) {
      pdf = window._pdfCache.pdf;
    } else {
      const base64 = await loadPdf(doc.id);
      if (!base64) return;
      const raw = atob(base64);
      const arr = new Uint8Array(raw.length);
      for (let i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
      pdf = await window.pdfjsLib.getDocument({ data: arr.slice(0) }).promise;
      window._pdfCache = { docId: doc.id, pdf };
    }

    const pdfPage = await pdf.getPage(window.activePageNum);
    const viewport = pdfPage.getViewport({ scale: 1.3 });
    const textContent = await pdfPage.getTextContent();

    console.log('[SelectFromImage] Viewport:', viewport.width.toFixed(1), 'x', viewport.height.toFixed(1),
      'scale:', viewport.scale, 'items:', textContent.items.length);

    // Method 1: Use viewport.convertToViewportPoint with canvas-pixel comparison
    const matched1 = [];
    const pad1 = Math.max(8, canvas.width * 0.008);

    // Method 2: Use raw PDF-space coordinates, normalize to percentage
    const matched2 = [];
    const pdfW = viewport.width / viewport.scale;
    const pdfH = viewport.height / viewport.scale;

    // Log first 5 text items for diagnostics
    let logCount = 0;

    for (const item of textContent.items) {
      if (!item.str.trim()) continue;

      // --- Method 1: viewport coordinates ---
      const [vpX, vpY] = viewport.convertToViewportPoint(item.transform[4], item.transform[5]);
      const fontSize = Math.abs(item.transform[3]) || Math.abs(item.transform[0]) || 10;
      // Try item.width both scaled and unscaled to handle different PDF.js behaviors
      const iwScaled = (item.width && item.width > 1) ? item.width * viewport.scale : 0;
      const iwUnscaled = (item.width && item.width > 1) ? item.width : 0;
      const iwEstimated = item.str.length * fontSize * viewport.scale * 0.55;
      // Use the most reasonable width: if scaled width is in plausible range use it, else try unscaled, else estimate
      let iw;
      if (iwScaled > 0 && iwScaled < viewport.width) {
        iw = iwScaled;
      } else if (iwUnscaled > 0 && iwUnscaled < viewport.width) {
        iw = iwUnscaled;
      } else {
        iw = iwEstimated;
      }
      const ih = fontSize * viewport.scale;

      if (logCount < 5) {
        console.log('[SelectFromImage] Item:', JSON.stringify({
          str: item.str.substring(0, 40), vpX: vpX.toFixed(1), vpY: vpY.toFixed(1),
          iw: iw.toFixed(1), ih: ih.toFixed(1), rawWidth: item.width,
          iwScaled: iwScaled.toFixed(1), iwUnscaled: iwUnscaled.toFixed(1),
          fontSize: fontSize.toFixed(1), transform: item.transform.map(v => +v.toFixed(2))
        }));
        logCount++;
      }

      // vpY is baseline: text occupies [vpY - ih, vpY] in viewport Y-down coords
      const itemLeft = vpX - pad1;
      const itemRight = vpX + iw + pad1;
      const itemTop = vpY - ih - pad1;
      const itemBottom = vpY + pad1;

      if (itemRight >= cb.x && itemLeft <= cb.x + cb.w &&
          itemBottom >= cb.y && itemTop <= cb.y + cb.h) {
        matched1.push(item.str);
      }

      // --- Method 2: percentage-based using raw PDF coordinates ---
      const pdfX = item.transform[4];
      const pdfY = item.transform[5];
      // In PDF space: origin bottom-left, Y up. Convert to percentage: top-left, Y down
      const pctLeft = pdfX / pdfW;
      const pctTop = 1 - (pdfY / pdfH);
      const pctFontH = fontSize / pdfH;
      const pctW = (item.width && item.width > 0) ? item.width / pdfW : item.str.length * fontSize * 0.55 / pdfW;
      const pctItemTop = pctTop - pctFontH;
      const pctItemBottom = pctTop;
      const pctItemLeft = pctLeft;
      const pctItemRight = pctLeft + pctW;

      const pPad = 0.015; // 1.5% padding
      if (pctItemRight + pPad >= selPct.left && pctItemLeft - pPad <= selPct.right &&
          pctItemBottom + pPad >= selPct.top && pctItemTop - pPad <= selPct.bottom) {
        matched2.push(item.str);
      }
    }

    console.log('[SelectFromImage] Method1 (viewport) matched:', matched1.length,
      'text:', matched1.join(' ').substring(0, 100));
    console.log('[SelectFromImage] Method2 (percent) matched:', matched2.length,
      'text:', matched2.join(' ').substring(0, 100));

    // Use whichever method found matches; prefer Method 1, fallback to Method 2
    const finalMatched = matched1.length > 0 ? matched1 : matched2;
    const extractedText = finalMatched.join(' ').trim();
    // Route to appropriate picker based on mode
    if (window._extractFieldMode) {
      showFieldLabelPicker(extractedText, displayBounds);
    } else {
      showNounCategoryPicker(extractedText, displayBounds);
    }
  } catch (err) {
    console.error('[SelectFromImage] Error:', err);
    if (window._extractFieldMode) {
      showFieldLabelPicker('', displayBounds);
    } else {
      showNounCategoryPicker('', displayBounds);
    }
  }
}

function showNounCategoryPicker(extractedText, bounds) {
  const existing = document.getElementById('noun-category-picker');

window.addNounFromSelection = function(category) {
  const input = document.getElementById('noun-text-input');

  if (!text) { if (input) { input.style.borderColor = '#ef4444'; input.placeholder = 'Please enter noun text'; } return; }

  const doc = window.appStore.documents.find(d => d.id === window.currentDocId);
  if (!doc) return;
  const page = doc.pages.find(p => p.pageNum === window.activePageNum);
  if (!page) return;
  if (!page.nouns) page.nouns = [];

  page.nouns.push({
    id: 'n_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
    text: text,
    category: category,
    source: 'manual',
    bounds: window._pendingNounBounds || null
  });

  window._nounSelectionMode = false;
  removeSelectionOverlay();
  renderDocumentDetail(document.getElementById('main-content'));
};

};

window.addNewType = function() {
  const id = document.getElementById('new-type-id').value.trim().toLowerCase().replace(/\s+/g,'_');
  const name = document.getElementById('new-type-name').value.trim();
  const kw = document.getElementById('new-type-keywords').value.split(',').map(k=>k.trim().toLowerCase()).filter(Boolean);
  if (!id || !name) { alert('ID and name are required'); return; }
  if (window.appStore.training.documentTypes.find(d=>d.id===id)) { alert('Type already exists'); return; }
  window.appStore.training.documentTypes.push({ id, name, keywords: kw, patterns: [] });
  saveStore(window.appStore);
  showMsg('training-message', 'success', `Document type "${name}" added!`);
  renderTraining(document.getElementById('main-content'));
};

window.addKeywords = function(typeId) {
  const input = document.getElementById('kw-input-'+typeId);
  const kws = input.value.split(',').map(k=>k.trim().toLowerCase()).filter(Boolean);
  if (kws.length === 0) return;
  const dt = window.appStore.training.documentTypes.find(d=>d.id===typeId);
  if (!dt) return;
  kws.forEach(k => { if (!dt.keywords.includes(k)) dt.keywords.push(k); });
  saveStore(window.appStore);
  showMsg('training-message', 'success', `${kws.length} keywords added to ${dt.name}!`);
  renderTraining(document.getElementById('main-content'));
};

window.trainClassify = function(docId, pageNum, typeId) {
  if (!typeId) return;
  const doc = window.appStore.documents.find(d=>d.id===docId);
  if (!doc) return;
  const page = doc.pages.find(p=>p.pageNum===pageNum);
  if (!page) return;
  const dt = window.appStore.training.documentTypes.find(d=>d.id===typeId);
  if (!dt) return;

  page.classification = { typeId, typeName: dt.name, confidence: 1.0, matchedKeywords: ['manual'] };
  page.extractedData = window.extractData(page.text, typeId);

  // Auto-train with meaningful keywords
  const newKeywords = extractTrainingKeywords(page.text).filter(w => !dt.keywords.includes(w));
  dt.keywords.push(...newKeywords);

  saveStore(window.appStore);
  showMsg('training-message', 'success', `Page classified as ${dt.name} and ${newKeywords.length} keywords learned!`);
  renderTraining(document.getElementById('main-content'));
};

window.selectedCommodityId = null;

// Helper: find field value by label pattern across all extractedData entries (handles manual/goods keys)
function findFieldByLabel(ed, labelPatterns) {
  for (const [key, field] of Object.entries(ed)) {
    const lbl = (field.label || '').toLowerCase();
    for (const pattern of labelPatterns) {
      if (lbl.includes(pattern)) return (field.value || '').trim();
    }
  }
  return '';
}

// Extract numeric price from amount string like "USD 390,000.00" or "780.00"
function extractNumericPrice(str) {
  if (!str) return 0;
  const cleaned = str.replace(/[A-Z]{3}\s*/g, '').replace(/,/g, '').replace(/\s*per\s+.*/i, '').trim();
  const num = parseFloat(cleaned);
  return isNaN(num) ? 0 : num;
}

function getDocumentCommodities() {
  const items = [];
  for (const doc of window.appStore.documents) {
    for (const page of doc.pages) {
      const ed = page.extractedData || {};
      if (!ed || Object.keys(ed).length === 0) continue;

      // Scan all fields by label (handles fixed keys AND manual/goods_ keys)
      const hsCode = findFieldByLabel(ed, ['hs code', 'hs_code', 'tariff']);
      const totalAmount = findFieldByLabel(ed, ['total amount', 'total_amount', 'amount due']);
      const amount = findFieldByLabel(ed, ['amount', 'credit amount', 'insured value']);
      const unitPrice = findFieldByLabel(ed, ['unit price', 'unit_price', 'price per']);
      const currency = findFieldByLabel(ed, ['currency']);
      const quantity = findFieldByLabel(ed, ['quantity', 'qty', 'total packages']);
      const grossWeight = findFieldByLabel(ed, ['gross weight', 'gross_weight', 'g.w']);
      const netWeight = findFieldByLabel(ed, ['net weight', 'net_weight', 'n.w']);
      const description = findFieldByLabel(ed, ['description']);

      const hasRelevant = hsCode || totalAmount || amount || unitPrice || quantity || grossWeight;
      if (!hasRelevant) continue;

      // Find matching reference commodity by HS code prefix
      let matchedCommodity = null;
      if (hsCode && window.priceData?.commodities) {
        matchedCommodity = window.priceData.commodities.find(c => hsCode.startsWith(c.hsCode));
      }

      // Determine best price for comparison: totalAmount > unitPrice > amount
      const bestAmount = totalAmount || amount;
      const numericPrice = extractNumericPrice(unitPrice || bestAmount);

      items.push({
        docId: doc.id, docName: doc.filename, pageNum: page.pageNum,
        typeName: page.classification ? page.classification.typeName : 'Unknown',
        hsCode: hsCode,
        description: description,
        amount: bestAmount,
        unitPrice: unitPrice,
        numericPrice: numericPrice,
        currency: currency,
        quantity: quantity,
        grossWeight: grossWeight,
        netWeight: netWeight,
        matchedCommodityId: matchedCommodity ? matchedCommodity.id : null,
        matchedCommodityName: matchedCommodity ? matchedCommodity.name : null
      });
    }
  }
  return items;
}

function renderPriceVariance(el) {
  const comms = window.priceData.commodities;
  if (!window.selectedCommodityId) window.selectedCommodityId = comms[0]?.id;
  const selected = comms.find(c => c.id === window.selectedCommodityId);
  if (!selected) return;

  if (!window._pvExportCountry) window._pvExportCountry = '';
  if (!window._pvImportCountry) window._pvImportCountry = '';

  const trades = window.priceData.tradeFlows.filter(t => t.commodity === selected.name);
  const docCommodities = getDocumentCommodities();

  // Build anomaly analysis for each doc commodity
  const anomalies = [];
  for (const dc of docCommodities) {
    if (!dc.matchedCommodityId || dc.numericPrice <= 0) continue;
    const comm = comms.find(c => c.id === dc.matchedCommodityId);
    if (!comm) continue;

    // Compare against selected country or all countries
    let comparePrice = null, compareCountry = 'Global';
    if (window._pvExportCountry) {
      const cp = comm.prices.find(p => p.country === window._pvExportCountry);
      if (cp) { comparePrice = cp; compareCountry = cp.country; }
    }

    const globalMin = Math.min(...comm.prices.map(p => p.min));
    const globalMax = Math.max(...comm.prices.map(p => p.max));
    const refMin = comparePrice ? comparePrice.min : globalMin;
    const refMax = comparePrice ? comparePrice.max : globalMax;
    const refAvg = comparePrice ? comparePrice.avg : comm.refPrice;

    const variance = ((dc.numericPrice - refAvg) / refAvg * 100).toFixed(1);
    let severity = 'normal', direction = '';
    if (dc.numericPrice < refMin * 0.5) { severity = 'high'; direction = 'under'; }
    else if (dc.numericPrice < refMin * 0.8) { severity = 'medium'; direction = 'under'; }
    else if (dc.numericPrice > refMax * 2) { severity = 'high'; direction = 'over'; }
    else if (dc.numericPrice > refMax * 1.3) { severity = 'medium'; direction = 'over'; }

    anomalies.push({ ...dc, commodity: comm.name, refMin, refMax, refAvg, variance, severity, direction, compareCountry, unit: comm.unit });
  }

          <span class="text-sm font-semibold text-gray-700">From Your Documents</span>
          <span class="text-xs text-gray-400">${docCommodities.length} item${docCommodities.length !== 1 ? 's' : ''} extracted</span>
        </div>
        ${anomalyCount > 0 ? '<span class="inline-flex items-center gap-1 px-2 py-1 rounded-full text-[10px] font-bold bg-red-100 text-red-700"><svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126z"/></svg> ' + anomalyCount + ' Price Anomal' + (anomalyCount > 1 ? 'ies' : 'y') + '</span>' : '<span class="inline-flex items-center gap-1 px-2 py-1 rounded-full text-[10px] font-bold bg-green-100 text-green-700">✓ No Anomalies</span>'}
      </div>
      <!-- Country selectors -->
      <div class="px-4 py-2 bg-gray-50 border-b border-gray-100 flex items-center gap-3 flex-wrap">
        <span class="text-[10px] font-semibold text-gray-500 uppercase">Compare against:</span>
        <label class="text-[10px] text-gray-600">Export Country
          <select id="pv-export-country" onchange="window._pvExportCountry=this.value;renderPriceVariance(document.getElementById('main-content'))" class="ml-1 px-2 py-1 border border-gray-300 rounded text-xs bg-white">
            <option value="">All (Global Range)</option>
            ${[...new Set(comms.flatMap(c => c.prices.map(p => p.country)))].sort().map(c => '<option value="' + c + '"' + (window._pvExportCountry === c ? ' selected' : '') + '>' + c + '</option>').join('')}
          </select>
        </label>
        <label class="text-[10px] text-gray-600">Import Country
          <select id="pv-import-country" onchange="window._pvImportCountry=this.value;renderPriceVariance(document.getElementById('main-content'))" class="ml-1 px-2 py-1 border border-gray-300 rounded text-xs bg-white">
            <option value="">Not specified</option>
            ${[...new Set(comms.flatMap(c => c.prices.map(p => p.country)))].sort().map(c => '<option value="' + c + '"' + (window._pvImportCountry === c ? ' selected' : '') + '>' + c + '</option>').join('')}
          </select>

      <table class="w-full text-xs">
        <thead><tr class="bg-gray-50 text-gray-500 font-medium">
          <th class="px-3 py-2 text-left">Document</th>
          <th class="px-3 py-2 text-left">Description</th>
          <th class="px-3 py-2 text-left">HS Code</th>
          <th class="px-3 py-2 text-right">Unit Price</th>
          <th class="px-3 py-2 text-right">Amount</th>
          <th class="px-3 py-2 text-right">Qty</th>
          <th class="px-3 py-2 text-center">Ref Price</th>
          <th class="px-3 py-2 text-center">Variance</th>
        </tr></thead>
        <tbody>
          ${docCommodities.map(dc => {
            const an = anomalies.find(a => a.docId === dc.docId && a.pageNum === dc.pageNum);
            const varHtml = an ? (an.severity === 'normal'
              ? '<span class="text-green-600 font-medium">✓ ' + an.variance + '%</span>'
              : '<span class="font-bold ' + (an.severity === 'high' ? 'text-red-600' : 'text-yellow-600') + '">' + (an.direction === 'under' ? '▼' : '▲') + ' ' + an.variance + '% <span class="text-[9px] px-1.5 py-0.5 rounded-full ' + (an.severity === 'high' ? 'bg-red-100 text-red-700' : 'bg-yellow-100 text-yellow-700') + '">' + an.severity.toUpperCase() + '</span></span>')
              : '<span class="text-gray-300">—</span>';
            const refHtml = an ? '$' + an.refAvg.toLocaleString() + '/' + an.unit : (dc.matchedCommodityId ? '—' : '<span class="text-gray-300 text-[10px]">No match</span>');
            return `<tr class="border-t border-gray-50 hover:bg-gray-50 cursor-pointer ${an && an.severity !== 'normal' ? (an.severity === 'high' ? 'bg-red-50' : 'bg-yellow-50') : ''}" onclick="window.showPdfPreviewModal('${dc.docId}',${dc.pageNum})">
              <td class="px-3 py-2 font-medium text-gray-900">${dc.docName} <span class="text-gray-400">P${dc.pageNum}</span></td>
              <td class="px-3 py-2 text-gray-700">${dc.description || dc.typeName || '—'}</td>
              <td class="px-3 py-2 font-mono text-gray-700">${dc.hsCode || '<span class="text-gray-300">—</span>'}</td>
              <td class="px-3 py-2 text-right text-gray-900">${dc.unitPrice ? formatAmountValue(dc.unitPrice) : '<span class="text-gray-300">—</span>'}</td>
              <td class="px-3 py-2 text-right text-gray-900">${dc.amount ? formatAmountValue((dc.currency ? dc.currency + ' ' : '') + dc.amount) : '<span class="text-gray-300">—</span>'}</td>
              <td class="px-3 py-2 text-right text-gray-700">${dc.quantity ? formatNumberValue(dc.quantity) : '<span class="text-gray-300">—</span>'}</td>
              <td class="px-3 py-2 text-center text-gray-600 text-[10px]">${refHtml}</td>
              <td class="px-3 py-2 text-center">${varHtml}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
  ` : `
    <div class="bg-gray-50 rounded-xl border border-gray-200 p-4 text-center">
      <p class="text-xs text-gray-400">No commodity data extracted from documents yet.</p>
      <p class="text-[10px] text-gray-400 mt-0.5">Upload and classify trade documents to see extracted prices and HS codes here.</p>
    </div>
  `;

  el.innerHTML = `
    <div class="fade-in space-y-6">
      <div><h1 class="text-2xl font-bold text-gray-900">Price Variance Analysis</h1><p class="text-sm text-gray-500 mt-1">Compare commodity prices across countries and analyze trade data</p></div>

      ${docCommsHtml}

      <!-- Commodity selector (filtered to relevant) -->
      <div>
        <p class="text-xs font-semibold text-gray-500 mb-2 uppercase tracking-wider">Reference Commodities</p>
        <div class="flex items-center gap-2 overflow-x-auto pb-2">
          ${(() => {
            const relevantIds = new Set(docCommodities.filter(dc => dc.matchedCommodityId).map(dc => dc.matchedCommodityId));
            const relevantComms = comms.filter(c => relevantIds.has(c.id));
            const displayComms = (relevantComms.length > 0 && !window._showAllCommodities) ? relevantComms : comms;
            if (relevantComms.length > 0 && !relevantIds.has(window.selectedCommodityId)) {
              window.selectedCommodityId = relevantComms[0].id;
            }
            return displayComms.map(c => `
              <button onclick="window.selectedCommodityId='${c.id}';window.pvAnalysis=null;renderPriceVariance(document.getElementById('main-content'))" class="flex-shrink-0 px-4 py-2.5 rounded-xl text-sm font-medium transition-all ${window.selectedCommodityId===c.id ? 'bg-brand-600 text-white shadow-md' : 'bg-white text-gray-600 hover:bg-gray-50 border border-gray-200'}">
                ${c.name}
              </button>
            `).join('');
          })()}
        </div>
        ${(() => {
          const relevantIds = new Set(docCommodities.filter(dc => dc.matchedCommodityId).map(dc => dc.matchedCommodityId));
          if (relevantIds.size > 0 && relevantIds.size < comms.length) {
            if (window._showAllCommodities) {
              return '<p class="text-[10px] text-gray-400 mt-0.5">Showing all ' + comms.length + ' commodities. <button onclick="window._showAllCommodities=false;renderPriceVariance(document.getElementById(\'main-content\'))" class="text-brand-600 hover:underline">Show relevant only</button></p>';
            }
            return '<p class="text-[10px] text-gray-400 mt-0.5">Showing ' + relevantIds.size + ' of ' + comms.length + ' commodities matching your documents. <button onclick="window._showAllCommodities=true;renderPriceVariance(document.getElementById(\'main-content\'))" class="text-brand-600 hover:underline">Show all</button></p>';
          }
          return '';
        })()}
      </div>

      <!-- Info cards -->
      <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-4"><p class="text-xs text-gray-400">Reference Price</p><p class="text-xl font-bold text-gray-900">$${selected.refPrice.toLocaleString()}</p><p class="text-xs text-gray-500">per ${selected.unit}</p></div>
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-4"><p class="text-xs text-gray-400">HS Code</p><p class="text-xl font-bold text-gray-900">${selected.hsCode}</p><p class="text-xs text-gray-500">Harmonized System</p></div>
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-4"><p class="text-xs text-gray-400">Price Range</p><p class="text-lg font-bold text-gray-900">$${Math.min(...selected.prices.map(p=>p.min)).toLocaleString()} - $${Math.max(...selected.prices.map(p=>p.max)).toLocaleString()}</p></div>
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-4"><p class="text-xs text-gray-400">Countries</p><p class="text-xl font-bold text-gray-900">${selected.prices.length}</p><p class="text-xs text-gray-500">data sources</p></div>
      </div>

      <!-- Tabs -->
      <div class="flex gap-1 bg-gray-100 rounded-lg p-1 w-fit">
        <button onclick="setPvTab('overview')" id="pv-tab-overview" class="px-4 py-2 text-xs font-medium rounded-md transition-colors tab-active">Country Prices</button>
        <button onclick="setPvTab('trade')" id="pv-tab-trade" class="px-4 py-2 text-xs font-medium rounded-md transition-colors text-gray-500">Import/Export Data</button>
        <button onclick="setPvTab('analyze')" id="pv-tab-analyze" class="px-4 py-2 text-xs font-medium rounded-md transition-colors text-gray-500">Price Analyzer</button>
      </div>

      <div id="pv-content"></div>
    </div>
  `;

  setPvTab('overview');
}

window.pvTab = 'overview';
window.setPvTab = function(tab) {
  window.pvTab = tab;
  ['overview','trade','analyze'].forEach(t => {
    const btn = document.getElementById('pv-tab-'+t);
    if (btn) { btn.className = `px-4 py-2 text-xs font-medium rounded-md transition-colors ${t===tab?'tab-active':'text-gray-500 hover:text-gray-700'}`; }
  });

  const selected = window.priceData.commodities.find(c => c.id === window.selectedCommodityId);
  const content = document.getElementById('pv-content');
  if (!selected || !content) return;

  if (tab === 'overview') renderPvOverview(content, selected);
  else if (tab === 'trade') renderPvTrade(content, selected);
  else renderPvAnalyze(content, selected);
};

function renderPvOverview(el, commodity) {
  const trendIcon = (t) => t==='rising'?'<span class="text-green-500 text-xs">&#9650;</span>':t==='falling'?'<span class="text-red-500 text-xs">&#9660;</span>':'<span class="text-gray-400 text-xs">&#9654;</span>';
  const varColor = (v) => v > 10 ? 'text-red-600' : v > 5 ? 'text-yellow-600' : v < -10 ? 'text-green-600' : v < -5 ? 'text-blue-600' : 'text-gray-700';

  el.innerHTML = `
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 fade-in">
      <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5">
        <h3 class="text-sm font-semibold text-gray-900 mb-4">Average Prices by Country</h3>
        <div style="height:320px"><canvas id="pv-chart"></canvas></div>
      </div>
      <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5">
        <h3 class="text-sm font-semibold text-gray-900 mb-4">Country Price Details</h3>
        <div class="space-y-2 max-h-[340px] overflow-y-auto">
          ${commodity.prices.sort((a,b)=>a.avg-b.avg).map(cp => {
            const v = ((cp.avg - commodity.refPrice)/commodity.refPrice*100).toFixed(1);
            return `<div class="flex items-center justify-between p-3 bg-gray-50 rounded-lg">
              <div><p class="text-sm font-medium text-gray-900">${cp.country}</p><p class="text-xs text-gray-400">$${cp.min.toLocaleString()} - $${cp.max.toLocaleString()}</p></div>
              <div class="text-right flex items-center gap-2">
                <div><p class="text-sm font-bold text-gray-900">$${cp.avg.toLocaleString()}</p><p class="text-xs font-medium ${varColor(v)}">${v>0?'+':''}${v}%</p></div>
                ${trendIcon(cp.trend)}
              </div>
            </div>`;
          }).join('')}
        </div>
      </div>
    </div>
  `;

  const colors = ['#3b82f6','#22c55e','#f59e0b','#ef4444','#8b5cf6','#06b6d4','#ec4899'];
  setTimeout(() => {
    const ctx = document.getElementById('pv-chart');
    if (!ctx) return;
    new Chart(ctx, {
      type: 'bar',
      data: {
        labels: commodity.prices.map(p=>p.country),
        datasets: [
          { label:'Avg Price', data: commodity.prices.map(p=>p.avg), backgroundColor: commodity.prices.map((_,i)=>colors[i%colors.length]), borderRadius: 4 },
          { label:'Reference', data: commodity.prices.map(()=>commodity.refPrice), type:'line', borderColor:'#ef4444', borderWidth:2, borderDash:[5,5], pointRadius:0, fill:false }
        ]
      },
      options: { responsive:true, maintainAspectRatio:false, plugins:{ legend:{ labels:{font:{size:11}} } }, scales:{ y:{ beginAtZero:false }, x:{ ticks:{font:{size:10}} } } }
    });
  }, 50);
}

function renderPvTrade(el, commodity) {
  const trades = window.priceData.tradeFlows.filter(t => t.commodity === commodity.name);
  const varColor = (v) => v > 10 ? 'text-red-600' : v > 5 ? 'text-yellow-600' : v < -10 ? 'text-green-600' : v < -5 ? 'text-blue-600' : 'text-gray-700';

  el.innerHTML = `
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5 fade-in">
      <h3 class="text-sm font-semibold text-gray-900 mb-4">Import/Export Trade Data - ${commodity.name}</h3>
      ${trades.length > 0 ? `
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead><tr class="border-b border-gray-200">
              <th class="text-left p-3 font-medium text-gray-500">Exporter</th>
              <th class="text-left p-3 font-medium text-gray-500">Importer</th>
              <th class="text-right p-3 font-medium text-gray-500">Volume (${commodity.unit})</th>
              <th class="text-right p-3 font-medium text-gray-500">Avg Price ($)</th>
              <th class="text-right p-3 font-medium text-gray-500">vs Reference</th>
              <th class="text-left p-3 font-medium text-gray-500">Period</th>
            </tr></thead>
            <tbody>
              ${trades.map(t => {
                const v = ((t.price-commodity.refPrice)/commodity.refPrice*100).toFixed(1);
                return `<tr class="border-b border-gray-50 hover:bg-gray-50">
                  <td class="p-3 font-medium text-gray-900">${t.exporter}</td>
                  <td class="p-3 text-gray-700">${t.importer}</td>
                  <td class="p-3 text-right text-gray-700">${t.vol.toLocaleString()}</td>
                  <td class="p-3 text-right font-medium text-gray-900">$${t.price.toLocaleString()}</td>
                  <td class="p-3 text-right font-medium ${varColor(v)}">${v>0?'+':''}${v}%</td>
                  <td class="p-3 text-gray-500">${t.period}</td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>
        <div class="mt-6"><h4 class="text-xs font-semibold text-gray-900 mb-3">Trade Volume by Route</h4><div style="height:250px"><canvas id="trade-chart"></canvas></div></div>
      ` : '<p class="text-sm text-gray-400 text-center py-8">No trade data available for this commodity</p>'}
    </div>
  `;

  if (trades.length > 0) {
    setTimeout(() => {
      const ctx = document.getElementById('trade-chart');
      if (!ctx) return;
      new Chart(ctx, {
        type:'bar',
        data:{ labels: trades.map(t=>`${t.exporter} → ${t.importer}`), datasets:[{ label:'Volume', data: trades.map(t=>t.vol), backgroundColor:'#3b82f6', borderRadius:4 }] },
        options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{display:false} }, scales:{ x:{ticks:{font:{size:9},maxRotation:30}}, y:{beginAtZero:true} } }
      });
    }, 50);
  }
}

function renderPvAnalyze(el, commodity) {
  el.innerHTML = `
    <div class="space-y-4 fade-in">
      <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5">
        <h3 class="text-sm font-semibold text-gray-900 mb-2">Analyze Document Price</h3>
        <p class="text-xs text-gray-500 mb-4">Enter a price from your trade document to compare against market rates</p>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
          <div><label class="text-xs font-medium text-gray-600 block mb-1">Price (USD per ${commodity.unit})</label><input type="number" id="pv-price" placeholder="Enter price..." class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-brand-500 outline-none"></div>
          <div><label class="text-xs font-medium text-gray-600 block mb-1">Country of Origin</label>
            <select id="pv-country" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-brand-500 outline-none bg-white">
              <option value="">Select country...</option>
              ${commodity.prices.map(p => `<option value="${p.country}">${p.country}</option>`).join('')}
            </select>
          </div>
          <div class="flex items-end"><button onclick="runPvAnalysis()" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-medium py-2 rounded-lg text-sm transition-colors">Analyze</button></div>
        </div>
      </div>
      <div id="pv-analysis-result"></div>
    </div>
  `;
}

window.runPvAnalysis = function() {
  const price = parseFloat(document.getElementById('pv-price').value);
  if (!price) { alert('Enter a price'); return; }
  const country = document.getElementById('pv-country').value;
  const commodity = window.priceData.commodities.find(c => c.id === window.selectedCommodityId);
  if (!commodity) return;

  const refVariance = ((price - commodity.refPrice) / commodity.refPrice * 100).toFixed(2);
  const countryData = country ? commodity.prices.find(p => p.country === country) : null;
  const varColor = (v) => { v=parseFloat(v); return v > 10 ? 'text-red-600 bg-red-50' : v > 5 ? 'text-yellow-600 bg-yellow-50' : v < -10 ? 'text-green-600 bg-green-50' : v < -5 ? 'text-blue-600 bg-blue-50' : 'text-gray-700 bg-blue-50'; };
  const varText = (v) => { v=parseFloat(v); return v > 10 ? 'text-red-600' : v > 5 ? 'text-yellow-600' : v < -10 ? 'text-green-600' : v < -5 ? 'text-blue-600' : 'text-gray-700'; };

  const result = document.getElementById('pv-analysis-result');
  result.innerHTML = `
    <div class="bg-white rounded-xl shadow-sm border border-brand-200 p-5 fade-in">
      <h3 class="text-sm font-semibold text-gray-900 mb-4">Analysis Results</h3>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
        <div class="bg-gray-50 rounded-lg p-3 text-center"><p class="text-xs text-gray-400">Document Price</p><p class="text-lg font-bold text-gray-900">$${price.toLocaleString()}</p></div>
        <div class="bg-gray-50 rounded-lg p-3 text-center"><p class="text-xs text-gray-400">Reference Price</p><p class="text-lg font-bold text-gray-900">$${commodity.refPrice.toLocaleString()}</p></div>
        <div class="rounded-lg p-3 text-center ${varColor(refVariance)}"><p class="text-xs text-gray-400">Variance</p><p class="text-lg font-bold">${refVariance>0?'+':''}${refVariance}%</p></div>
      </div>
      ${countryData ? `
        <div class="p-4 rounded-lg ${price>=countryData.min&&price<=countryData.max?'bg-green-50 border border-green-200':'bg-red-50 border border-red-200'} mb-4">
          <div class="flex items-center gap-2 mb-2">
            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${price>=countryData.min&&price<=countryData.max?'bg-green-100 text-green-800':'bg-red-100 text-red-800'}">${price>=countryData.min&&price<=countryData.max?'Within Expected Range':'Outside Expected Range'}</span>
            <span class="text-xs text-gray-500">${country}</span>
          </div>
          <div class="grid grid-cols-4 gap-3 text-center">
            <div><p class="text-[10px] text-gray-400">Country Avg</p><p class="text-sm font-bold">$${countryData.avg.toLocaleString()}</p></div>
            <div><p class="text-[10px] text-gray-400">Min</p><p class="text-sm font-bold">$${countryData.min.toLocaleString()}</p></div>
            <div><p class="text-[10px] text-gray-400">Max</p><p class="text-sm font-bold">$${countryData.max.toLocaleString()}</p></div>
            <div><p class="text-[10px] text-gray-400">Variance</p><p class="text-sm font-bold ${varText(((price-countryData.avg)/countryData.avg*100).toFixed(1))}">${((price-countryData.avg)/countryData.avg*100)>0?'+':''}${((price-countryData.avg)/countryData.avg*100).toFixed(1)}%</p></div>
          </div>
        </div>
      ` : ''}
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5 mt-4 fade-in">
      <h3 class="text-sm font-semibold text-gray-900 mb-4">Price Comparison Across Countries</h3>
      <div style="height:300px"><canvas id="pv-analysis-chart"></canvas></div>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5 mt-4 fade-in">
      <h3 class="text-sm font-semibold text-gray-900 mb-4">Detailed Country Comparison</h3>
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead><tr class="border-b border-gray-200">
            <th class="text-left p-3 font-medium text-gray-500">Country</th>
            <th class="text-right p-3 font-medium text-gray-500">Avg</th>
            <th class="text-right p-3 font-medium text-gray-500">Min</th>
            <th class="text-right p-3 font-medium text-gray-500">Max</th>
            <th class="text-center p-3 font-medium text-gray-500">Trend</th>
            <th class="text-right p-3 font-medium text-gray-500">Variance</th>
          </tr></thead>
          <tbody>
            ${commodity.prices.map(cp => {
              const v = ((price-cp.avg)/cp.avg*100).toFixed(1);
              return `<tr class="border-b border-gray-50 ${cp.country===country?'bg-brand-50':''} hover:bg-gray-50">
                <td class="p-3 font-medium text-gray-900">${cp.country}</td>
                <td class="p-3 text-right">$${cp.avg.toLocaleString()}</td>
                <td class="p-3 text-right text-gray-500">$${cp.min.toLocaleString()}</td>
                <td class="p-3 text-right text-gray-500">$${cp.max.toLocaleString()}</td>
                <td class="p-3 text-center">${cp.trend==='rising'?'<span class="text-green-500">&#9650;</span>':cp.trend==='falling'?'<span class="text-red-500">&#9660;</span>':'<span class="text-gray-400">&#9654;</span>'}</td>
                <td class="p-3 text-right font-medium ${varText(v)}">${v>0?'+':''}${v}%</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;

  const colors = ['#3b82f6','#22c55e','#f59e0b','#ef4444','#8b5cf6','#06b6d4','#ec4899'];
  setTimeout(() => {
    const ctx = document.getElementById('pv-analysis-chart');
    if (!ctx) return;
    new Chart(ctx, {
      type:'bar',
      data:{
        labels: commodity.prices.map(p=>p.country),
        datasets:[
          { label:'Avg Price', data: commodity.prices.map(p=>p.avg), backgroundColor: commodity.prices.map((_,i)=>colors[i%colors.length]), borderRadius:4 },
          { label:'Your Price', data: commodity.prices.map(()=>price), type:'line', borderColor:'#ef4444', borderWidth:2, borderDash:[5,5], pointRadius:0, fill:false }
        ]
      },
      options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{labels:{font:{size:11}}} }, scales:{ y:{beginAtZero:false}, x:{ticks:{font:{size:10}}} } }
    });
  }, 50);
};

// ===================== Init =====================
navigate('dashboard');
</script>
</body>
</html>
