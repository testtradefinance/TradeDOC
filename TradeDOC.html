// ===================== PDF.js Setup =====================

// ===================== Data Store =====================
const STORAGE_KEY = 'tradedoc_data';

function loadStore() {
  try {
    const data = localStorage.getItem(STORAGE_KEY);
    return data ? JSON.parse(data) : { documents: [], training: null };
  } catch { return { documents: [], training: null }; }
}
function saveStore(store) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(store));
}
window.appStore = loadStore();
if (!window.appStore.training) {
  window.appStore.training = getDefaultTraining();
  saveStore(window.appStore);
}

// ===================== Default Training Data =====================

      { id:'insurance_certificate', name:'Insurance Certificate', keywords:['insurance','insurance certificate','insurance policy','insured','underwriter','premium','coverage','marine insurance','all risks','loss or damage'], patterns:['insurance\\s*(certificate|policy)','marine\\s*insurance','all\\s*risks'] },
      { id:'bill_of_exchange', name:'Bill of Exchange', keywords:['bill of exchange','draft','pay to the order','drawer','drawee','payee','at sight','days after sight','acceptance','tenor'], patterns:['bill\\s*of\\s*exchange','pay\\s*to\\s*the\\s*order','at\\s*sight'] },
      { id:'customs_declaration', name:'Customs Declaration', keywords:['customs','customs declaration','import declaration','export declaration','hs code','harmonized','tariff','duty','customs value','clearance'], patterns:['customs\\s*declaration','hs\\s*code','harmonized\\s*system'] },
      { id:'inspection_certificate', name:'Inspection Certificate', keywords:['inspection certificate','inspection report','quality inspection','pre-shipment','surveyor','sgs','bureau veritas','intertek','conforms'], patterns:['inspection\\s*(certificate|report)','pre-shipment\\s*inspection'] },
      { id:'warehouse_receipt', name:'Warehouse Receipt', keywords:['warehouse receipt','warehouse','storage','depositor','warehouseman','lot number','storage charges'], patterns:['warehouse\\s*receipt','storage\\s*charges'] }
    ]
  };
}

// ===================== Classifier =====================
window.classifyPage = function(text) {
  const training = window.appStore.training;
  const lower = text.toLowerCase();
  const scores = [];

  for (const dt of training.documentTypes) {
    let score = 0;
    const matched = [];
    for (const kw of dt.keywords) {
      if (lower.includes(kw.toLowerCase())) { score += 2; matched.push(kw); }
    }
    for (const p of dt.patterns) {
      try { if (new RegExp(p, 'i').test(text)) score += 3; } catch {}
    }
    if (score > 0) scores.push({ typeId: dt.id, typeName: dt.name, score, matchedKeywords: matched });
  }

  scores.sort((a, b) => b.score - a.score);
  if (scores.length === 0) return { typeId:'unclassified', typeName:'Unclassified', confidence:0, matchedKeywords:[] };

  const conf = Math.min(0.99, scores[0].score / Math.max(10, scores[0].score * 1.5));
  if (conf < 0.15) return { typeId:'unclassified', typeName:'Unclassified', confidence: conf, matchedKeywords: scores[0].matchedKeywords };

  return { ...scores[0], confidence: conf };
};

// ===================== Extractor =====================
const extractionRules = {

    { name:'seller', label:'Seller/Exporter', patterns:[/(?:seller|exporter|from|shipper)[.:;\s]*([^\n]{5,60})/i] },
    { name:'buyer', label:'Buyer/Importer', patterns:[/(?:buyer|importer|bill\s*to|sold\s*to|consignee)[.:;\s]*([^\n]{5,60})/i] },
    { name:'currency', label:'Currency', patterns:[/(USD|EUR|GBP|JPY|CNY|INR|AED|SGD)/i] },
    { name:'totalAmount', label:'Total Amount', patterns:[/(?:total|grand\s*total|amount\s*due|net\s*amount)[.:;\s]*(?:USD|EUR|GBP|JPY|CNY|INR)?\s*([0-9,]+\.?\d*)/i] },
    { name:'paymentTerms', label:'Payment Terms', patterns:[/(?:payment\s*terms?|terms\s*of\s*payment)[.:;\s]*([^\n]{5,80})/i] },

  bill_of_lading: [

    { name:'amount', label:'Credit Amount', patterns:[/(?:amount|credit\s*amount|value)[.:;\s]*(?:USD|EUR|GBP)?\s*([0-9,]+\.?\d*)/i] },
    { name:'expiryDate', label:'Expiry Date', patterns:[/(?:expiry|expiration|valid\s*until)[.:;\s]*(\d{1,2}[\/-]\d{1,2}[\/-]\d{2,4})/i] },
  ],
  certificate_of_origin: [

  packing_list: [

    { name:'amount', label:'Amount', patterns:[/(?:amount|sum\s*of|pay)[.:;\s]*(?:USD|EUR|GBP)?\s*([0-9,]+\.?\d*)/i] },

    { name:'hsCode', label:'HS Code', patterns:[/(?:hs\s*code|tariff)[.:;\s]*(\d{4,10})/i] },

    { name:'inspector', label:'Inspector', patterns:[/(?:inspector|surveyor)[.:;\s]*([^\n]{5,80})/i] },
    { name:'result', label:'Result', patterns:[/(?:result|finding|conclusion)[.:;\s]*(pass|fail|conform|satisfactory|[^\n]{5,60})/i] },
  ],
  warehouse_receipt: [
    { name:'receiptNumber', label:'Receipt No', patterns:[/(?:receipt|warehouse\s*receipt)\s*(?:no|number|#)?[.:;\s]*([A-Z0-9\-\/]+)/i] },
    { name:'location', label:'Location', patterns:[/(?:location|warehouse|stored\s*at)[.:;\s]*([^\n]{5,80})/i] },
    { name:'quantity', label:'Quantity', patterns:[/(?:quantity|qty)[.:;\s]*([0-9,]+\.?\d*)/i] },
  ]
};

window.extractData = function(text, typeId) {
  const rules = extractionRules[typeId];
  if (!rules) return {};
  const result = {};
  for (const field of rules) {
    for (const pattern of field.patterns) {
      const match = text.match(pattern);
      if (match) { result[field.name] = { label: field.label, value: (match[1] || match[0]).trim() }; break; }
    }
  }
  return result;
};

// ===================== Navigation =====================
window.currentPage = 'dashboard';
window.currentDocId = null;

window.navigate = function(page, docId) {
  window.currentPage = page;
  window.currentDocId = docId || null;
  document.querySelectorAll('.nav-btn').forEach(btn => {
    const nav = btn.dataset.nav;
    btn.classList.toggle('bg-brand-50', nav === page || (page === 'document-detail' && nav === 'documents'));
    btn.classList.toggle('text-brand-700', nav === page || (page === 'document-detail' && nav === 'documents'));
    btn.classList.toggle('text-gray-600', nav !== page && !(page === 'document-detail' && nav === 'documents'));
  });
  // Close mobile sidebar
  document.getElementById('sidebar').classList.add('-translate-x-full');
  document.getElementById('mobile-overlay').classList.add('hidden');
  renderPage();
};

window.toggleSidebar = function() {
  const sb = document.getElementById('sidebar');
  const ov = document.getElementById('mobile-overlay');
  sb.classList.toggle('-translate-x-full');
  ov.classList.toggle('hidden');
};

// ===================== Rendering =====================
window.renderPage = function() {
  const mc = document.getElementById('main-content');
  const titles = { dashboard:'Dashboard', upload:'Upload Document', documents:'Documents', training:'Training Center', 'price-variance':'Price Variance Analysis', 'document-detail':'Document Details' };
  document.getElementById('page-title').textContent = titles[window.currentPage] || '';

  switch (window.currentPage) {
    case 'dashboard': renderDashboard(mc); break;
    case 'upload': renderUpload(mc); break;
    case 'documents': renderDocuments(mc); break;
    case 'document-detail': renderDocumentDetail(mc); break;
    case 'training': renderTraining(mc); break;
    case 'price-variance': renderPriceVariance(mc); break;
  }
};

window.selectedFile = null;
window.selectedPdfData = null;

function handleFile(file) {
  if (!file || file.type !== 'application/pdf') { alert('Please select a PDF file'); return; }
  window.selectedFile = file;
  document.getElementById('drop-zone').classList.add('hidden');
  document.getElementById('file-info').classList.remove('hidden');
  document.getElementById('upload-btn').classList.remove('hidden');
  document.getElementById('file-name').textContent = file.name;
  document.getElementById('file-size').textContent = (file.size / 1024 / 1024).toFixed(2) + ' MB';
}

window.clearFile = function() {
  window.selectedFile = null;
  document.getElementById('drop-zone').classList.remove('hidden');
  document.getElementById('file-info').classList.add('hidden');
  document.getElementById('upload-btn').classList.add('hidden');
  document.getElementById('upload-result').innerHTML = '';
};

window.processFile = async function() {
  if (!window.selectedFile) return;
  const btn = document.getElementById('upload-btn');
  const progress = document.getElementById('progress-bar');
  const fill = document.getElementById('progress-fill');
  const result = document.getElementById('upload-result');

  btn.disabled = true;
  btn.innerHTML = '<svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg> Processing...';
  progress.classList.remove('hidden');

  try {
    const arrayBuffer = await window.selectedFile.arrayBuffer();
    fill.style.width = '30%';

    const pdf = await window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;
    fill.style.width = '50%';

    const pages = [];
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const textContent = await page.getTextContent();
      const text = textContent.items.map(item => item.str).join(' ');

      const classification = window.classifyPage(text);
      const extractedData = classification.typeId !== 'unclassified' ? window.extractData(text, classification.typeId) : {};

      pages.push({ pageNum: i, text: text.substring(0, 5000), classification, extractedData });
      fill.style.width = (50 + (i / pdf.numPages) * 45) + '%';
    }

    // Store the PDF as base64 for later viewing
    const base64 = btoa(new Uint8Array(arrayBuffer).reduce((s, b) => s + String.fromCharCode(b), ''));

    const doc = {
      id: 'doc_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6),
      filename: window.selectedFile.name,
      uploadDate: new Date().toISOString(),
      totalPages: pdf.numPages,
      fileSize: window.selectedFile.size,
      pdfBase64: base64,
      pages
    };

    window.appStore.documents.push(doc);
    saveStore(window.appStore);
    fill.style.width = '100%';

    result.innerHTML = `
      <div class="bg-white rounded-xl shadow-sm border border-green-200 p-5 mt-4 fade-in">
        <div class="flex items-center gap-3 mb-4">
          <svg class="w-6 h-6 text-green-600" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          <div><p class="font-semibold text-green-800">Document Processed Successfully</p><p class="text-sm text-green-600">${doc.filename} - ${doc.totalPages} pages analyzed</p></div>
        </div>
        <div class="space-y-2">
          ${pages.map(p => `
            <div class="flex items-center justify-between bg-gray-50 rounded-lg p-3">
              <div class="flex items-center gap-3">
                <span class="w-7 h-7 bg-green-100 rounded flex items-center justify-center text-xs font-bold text-green-700">${p.pageNum}</span>
                <div><p class="text-sm font-medium text-gray-900">${p.classification.typeName}</p><p class="text-xs text-gray-400">${Object.keys(p.extractedData).length} fields extracted</p></div>
              </div>
              ${p.classification.typeId !== 'unclassified'
                ? `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800">${(p.classification.confidence*100).toFixed(0)}%</span>`
                : '<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-yellow-100 text-yellow-800">Needs Training</span>'}
            </div>
          `).join('')}
        </div>
        <div class="flex gap-3 mt-4">
          <button onclick="navigate('document-detail','${doc.id}')" class="flex-1 bg-brand-600 hover:bg-brand-700 text-white font-medium py-2 rounded-lg text-sm transition-colors">View Details</button>
          <button onclick="clearFile();renderUpload(document.getElementById('main-content'))" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium py-2 rounded-lg text-sm transition-colors">Upload Another</button>
        </div>
      </div>
    `;
  } catch (err) {
    result.innerHTML = `<div class="bg-red-50 text-red-600 rounded-lg p-3 mt-4 text-sm">${err.message}</div>`;
  }

  btn.classList.add('hidden');
};

async function renderPdfPage(doc, pageNum) {
  try {
    const raw = atob(doc.pdfBase64);
    const arr = new Uint8Array(raw.length);
    for (let i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);

    const pdf = await window.pdfjsLib.getDocument({ data: arr }).promise;
    const page = await pdf.getPage(pageNum);
    const canvas = document.getElementById('pdf-canvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const viewport = page.getViewport({ scale: 1.3 });
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    await page.render({ canvasContext: ctx, viewport }).promise;
  } catch (err) {
    console.error('PDF render error:', err);
  }
}

window.reclassifyCurrentPage = function() {
  const typeId = document.getElementById('reclassify-select').value;
  if (!typeId) return;

  const doc = window.appStore.documents.find(d => d.id === window.currentDocId);
  if (!doc) return;
  const page = doc.pages.find(p => p.pageNum === window.activePageNum);
  if (!page) return;

  const dt = window.appStore.training.documentTypes.find(d => d.id === typeId);
  page.classification = { typeId, typeName: dt.name, confidence: 1.0, matchedKeywords: ['manual'] };
  page.extractedData = window.extractData(page.text, typeId);

  // Auto-train: learn keywords from this page
  const words = page.text.toLowerCase().split(/\s+/).filter(w => w.length > 3);
  const freq = {};
  words.forEach(w => { freq[w] = (freq[w]||0)+1; });
  const topWords = Object.entries(freq).sort((a,b) => b[1]-a[1]).slice(0,8).map(([w]) => w).filter(w => !dt.keywords.includes(w));
  dt.keywords.push(...topWords);

  saveStore(window.appStore);
  renderDocumentDetail(document.getElementById('main-content'));
};

  const name = document.getElementById('new-type-name').value.trim();
  const kw = document.getElementById('new-type-keywords').value.split(',').map(k=>k.trim().toLowerCase()).filter(Boolean);
  if (!id || !name) { alert('ID and name are required'); return; }
  if (window.appStore.training.documentTypes.find(d=>d.id===id)) { alert('Type already exists'); return; }
  window.appStore.training.documentTypes.push({ id, name, keywords: kw, patterns: [] });
  saveStore(window.appStore);
  showMsg('training-message', 'success', `Document type "${name}" added!`);
  renderTraining(document.getElementById('main-content'));
};

window.addKeywords = function(typeId) {
  const input = document.getElementById('kw-input-'+typeId);
  const kws = input.value.split(',').map(k=>k.trim().toLowerCase()).filter(Boolean);
  if (kws.length === 0) return;
  const dt = window.appStore.training.documentTypes.find(d=>d.id===typeId);
  if (!dt) return;
  kws.forEach(k => { if (!dt.keywords.includes(k)) dt.keywords.push(k); });
  saveStore(window.appStore);
  showMsg('training-message', 'success', `${kws.length} keywords added to ${dt.name}!`);
  renderTraining(document.getElementById('main-content'));
};

window.trainClassify = function(docId, pageNum, typeId) {
  if (!typeId) return;
  const doc = window.appStore.documents.find(d=>d.id===docId);
  if (!doc) return;
  const page = doc.pages.find(p=>p.pageNum===pageNum);
  if (!page) return;
  const dt = window.appStore.training.documentTypes.find(d=>d.id===typeId);
  if (!dt) return;

  page.classification = { typeId, typeName: dt.name, confidence: 1.0, matchedKeywords: ['manual'] };
  page.extractedData = window.extractData(page.text, typeId);

  // Auto-train
  const words = page.text.toLowerCase().split(/\s+/).filter(w => w.length > 3);
  const freq = {};
  words.forEach(w => { freq[w] = (freq[w]||0)+1; });
  const topWords = Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([w])=>w).filter(w=>!dt.keywords.includes(w));
  dt.keywords.push(...topWords);

  saveStore(window.appStore);
  showMsg('training-message', 'success', `Page classified as ${dt.name} and ${topWords.length} keywords learned!`);
  renderTraining(document.getElementById('main-content'));
};

function showMsg(containerId, type, text) {
  const c = document.getElementById(containerId);
  if (!c) return;
  c.innerHTML = `<div class="flex items-center gap-2 p-3 rounded-lg text-sm mb-2 ${type==='success'?'bg-green-50 text-green-700':'bg-red-50 text-red-700'} fade-in">
    <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="${type==='success'?'M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z':'M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z'}"/></svg>
    ${text}
    <button onclick="this.parentElement.remove()" class="ml-auto"><svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12"/></svg></button>
  </div>`;
  setTimeout(() => { if (c.firstChild) c.firstChild.remove(); }, 5000);
}

window.pvTab = 'overview';
window.setPvTab = function(tab) {
  window.pvTab = tab;
  ['overview','trade','analyze'].forEach(t => {
    const btn = document.getElementById('pv-tab-'+t);
    if (btn) { btn.className = `px-4 py-2 text-xs font-medium rounded-md transition-colors ${t===tab?'tab-active':'text-gray-500 hover:text-gray-700'}`; }
  });

  const selected = window.priceData.commodities.find(c => c.id === window.selectedCommodityId);
  const content = document.getElementById('pv-content');
  if (!selected || !content) return;

  if (tab === 'overview') renderPvOverview(content, selected);

  else renderPvAnalyze(content, selected);
};

window.runPvAnalysis = function() {
  const price = parseFloat(document.getElementById('pv-price').value);
  if (!price) { alert('Enter a price'); return; }
  const country = document.getElementById('pv-country').value;
  const commodity = window.priceData.commodities.find(c => c.id === window.selectedCommodityId);
  if (!commodity) return;

  const refVariance = ((price - commodity.refPrice) / commodity.refPrice * 100).toFixed(2);
  const countryData = country ? commodity.prices.find(p => p.country === country) : null;
  const varColor = (v) => { v=parseFloat(v); return v > 10 ? 'text-red-600 bg-red-50' : v > 5 ? 'text-yellow-600 bg-yellow-50' : v < -10 ? 'text-green-600 bg-green-50' : v < -5 ? 'text-blue-600 bg-blue-50' : 'text-gray-700 bg-blue-50'; };
  const varText = (v) => { v=parseFloat(v); return v > 10 ? 'text-red-600' : v > 5 ? 'text-yellow-600' : v < -10 ? 'text-green-600' : v < -5 ? 'text-blue-600' : 'text-gray-700'; };

  const result = document.getElementById('pv-analysis-result');
  result.innerHTML = `
    <div class="bg-white rounded-xl shadow-sm border border-brand-200 p-5 fade-in">
      <h3 class="text-sm font-semibold text-gray-900 mb-4">Analysis Results</h3>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
        <div class="bg-gray-50 rounded-lg p-3 text-center"><p class="text-xs text-gray-400">Document Price</p><p class="text-lg font-bold text-gray-900">$${price.toLocaleString()}</p></div>
        <div class="bg-gray-50 rounded-lg p-3 text-center"><p class="text-xs text-gray-400">Reference Price</p><p class="text-lg font-bold text-gray-900">$${commodity.refPrice.toLocaleString()}</p></div>
        <div class="rounded-lg p-3 text-center ${varColor(refVariance)}"><p class="text-xs text-gray-400">Variance</p><p class="text-lg font-bold">${refVariance>0?'+':''}${refVariance}%</p></div>
      </div>
      ${countryData ? `
        <div class="p-4 rounded-lg ${price>=countryData.min&&price<=countryData.max?'bg-green-50 border border-green-200':'bg-red-50 border border-red-200'} mb-4">
          <div class="flex items-center gap-2 mb-2">
            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${price>=countryData.min&&price<=countryData.max?'bg-green-100 text-green-800':'bg-red-100 text-red-800'}">${price>=countryData.min&&price<=countryData.max?'Within Expected Range':'Outside Expected Range'}</span>
            <span class="text-xs text-gray-500">${country}</span>
          </div>
          <div class="grid grid-cols-4 gap-3 text-center">
            <div><p class="text-[10px] text-gray-400">Country Avg</p><p class="text-sm font-bold">$${countryData.avg.toLocaleString()}</p></div>
            <div><p class="text-[10px] text-gray-400">Min</p><p class="text-sm font-bold">$${countryData.min.toLocaleString()}</p></div>
            <div><p class="text-[10px] text-gray-400">Max</p><p class="text-sm font-bold">$${countryData.max.toLocaleString()}</p></div>
            <div><p class="text-[10px] text-gray-400">Variance</p><p class="text-sm font-bold ${varText(((price-countryData.avg)/countryData.avg*100).toFixed(1))}">${((price-countryData.avg)/countryData.avg*100)>0?'+':''}${((price-countryData.avg)/countryData.avg*100).toFixed(1)}%</p></div>
          </div>
        </div>
      ` : ''}
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5 mt-4 fade-in">
      <h3 class="text-sm font-semibold text-gray-900 mb-4">Price Comparison Across Countries</h3>
      <div style="height:300px"><canvas id="pv-analysis-chart"></canvas></div>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5 mt-4 fade-in">
      <h3 class="text-sm font-semibold text-gray-900 mb-4">Detailed Country Comparison</h3>
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead><tr class="border-b border-gray-200">
            <th class="text-left p-3 font-medium text-gray-500">Country</th>
            <th class="text-right p-3 font-medium text-gray-500">Avg</th>
            <th class="text-right p-3 font-medium text-gray-500">Min</th>
            <th class="text-right p-3 font-medium text-gray-500">Max</th>
            <th class="text-center p-3 font-medium text-gray-500">Trend</th>
            <th class="text-right p-3 font-medium text-gray-500">Variance</th>
          </tr></thead>
          <tbody>
            ${commodity.prices.map(cp => {
              const v = ((price-cp.avg)/cp.avg*100).toFixed(1);
              return `<tr class="border-b border-gray-50 ${cp.country===country?'bg-brand-50':''} hover:bg-gray-50">

  const colors = ['#3b82f6','#22c55e','#f59e0b','#ef4444','#8b5cf6','#06b6d4','#ec4899'];
  setTimeout(() => {
    const ctx = document.getElementById('pv-analysis-chart');
    if (!ctx) return;
    new Chart(ctx, {
      type:'bar',
      data:{
        labels: commodity.prices.map(p=>p.country),
        datasets:[
          { label:'Avg Price', data: commodity.prices.map(p=>p.avg), backgroundColor: commodity.prices.map((_,i)=>colors[i%colors.length]), borderRadius:4 },
          { label:'Your Price', data: commodity.prices.map(()=>price), type:'line', borderColor:'#ef4444', borderWidth:2, borderDash:[5,5], pointRadius:0, fill:false }
        ]
      },
      options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{labels:{font:{size:11}}} }, scales:{ y:{beginAtZero:false}, x:{ticks:{font:{size:10}}} } }
    });
  }, 50);
};
