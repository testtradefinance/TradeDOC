<script>
// ===================== PDF.js Setup =====================
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
window.pdfjsLib = pdfjsLib;

// ===================== Data Store =====================
const STORAGE_KEY = 'tradedoc_data';
const IDB_NAME = 'tradedoc_pdfs';
const IDB_STORE = 'pdfs';

function loadStore() {
  try {
    const data = localStorage.getItem(STORAGE_KEY);
    return data ? JSON.parse(data) : { documents: [], training: null };
  } catch { return { documents: [], training: null }; }
}
function saveStore(store) {
  // Strip pdfBase64 from documents before saving to localStorage
  const toSave = { ...store, documents: store.documents.map(d => {
    const { pdfBase64, ...rest } = d;
    return rest;
  })};
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave)); }
  catch (e) { console.error('localStorage save error:', e); }
}

// IndexedDB for large PDF binary storage
function openPdfDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = () => { req.result.createObjectStore(IDB_STORE); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function savePdf(docId, base64) {
  const db = await openPdfDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).put(base64, docId);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function loadPdf(docId) {
  const db = await openPdfDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, 'readonly');
    const req = tx.objectStore(IDB_STORE).get(docId);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}
async function deletePdf(docId) {
  const db = await openPdfDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).delete(docId);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

window.appStore = loadStore();
if (!window.appStore.training) {
  window.appStore.training = getDefaultTraining();
  saveStore(window.appStore);
}
if (!window.appStore.nounConsolidations) window.appStore.nounConsolidations = [];
if (!window.appStore.manualRedFlags) window.appStore.manualRedFlags = {};
if (!window.appStore.userRedFlags) window.appStore.userRedFlags = [];
if (!window.appStore.complianceReviews) window.appStore.complianceReviews = {};

// Migrate: ensure new default document types are present for existing users
(function migrateTypes() {
  const defaults = getDefaultTraining().documentTypes;
  let added = false;
  for (const def of defaults) {
    if (!window.appStore.training.documentTypes.find(d => d.id === def.id)) {
      window.appStore.training.documentTypes.push(def);
      added = true;
    }
  }
  if (added) saveStore(window.appStore);
})();


// Clear all data and reinitialize
window.clearAllData = async function() {
  if (!confirm('Are you sure you want to clear all uploaded documents and reset the application? This cannot be undone.')) return;
  // Clear localStorage
  localStorage.removeItem(STORAGE_KEY);
  // Clear all PDFs from IndexedDB
  try {
    const db = await openPdfDB();
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).clear();
    await new Promise((resolve, reject) => { tx.oncomplete = resolve; tx.onerror = () => reject(tx.error); });
  } catch (e) { console.error('Failed to clear IndexedDB:', e); }
  // Reset in-memory store
  window.appStore = { documents: [], training: getDefaultTraining() };
  saveStore(window.appStore);
  // Clear PDF cache
  window._pdfCache = { docId: null, pdf: null };
  // Navigate to dashboard
  navigate('dashboard');
};

// ===================== Default Training Data =====================
function getDefaultTraining() {
  return {
    documentTypes: [
      { id:'commercial_invoice', name:'Commercial Invoice', keywords:['invoice','invoice number','inv no','commercial invoice','bill to','ship to','unit price','total amount','payment terms','incoterms','fob','cif','cfr'], patterns:['invoice\\s*(no|number|#)','total\\s*amount','unit\\s*price','grand\\s*total'] },
      { id:'bill_of_lading', name:'Bill of Lading', keywords:['bill of lading','b/l','bl number','shipper','consignee','notify party','vessel','voyage','port of loading','port of discharge','container no','seal no','freight'], patterns:['bill\\s*of\\s*lading','b\\/l\\s*(no|number)','port\\s*of\\s*(loading|discharge)','container\\s*(no|number)'] },
      { id:'letter_of_credit', name:'Letter of Credit', keywords:['letter of credit','l/c','lc number','documentary credit','irrevocable','issuing bank','advising bank','beneficiary','applicant','credit amount','expiry date','swift','mt700'], patterns:['letter\\s*of\\s*credit','documentary\\s*credit','l\\/c\\s*(no|number)','issuing\\s*bank'] },
      { id:'certificate_of_origin', name:'Certificate of Origin', keywords:['certificate of origin','country of origin','manufactured in','produced in','chamber of commerce','goods originating','preferential','form a','gsp'], patterns:['certificate\\s*of\\s*origin','country\\s*of\\s*origin','goods\\s*originating'] },
      { id:'packing_list', name:'Packing List', keywords:['packing list','carton','gross weight','net weight','dimensions','cbm','cubic meter','package','marks and numbers','measurement'], patterns:['packing\\s*list','gross\\s*weight','net\\s*weight','marks\\s*and\\s*numbers'] },
      { id:'insurance_certificate', name:'Insurance Certificate', keywords:['insurance','insurance certificate','insurance policy','insured','underwriter','premium','coverage','marine insurance','all risks','loss or damage'], patterns:['insurance\\s*(certificate|policy)','marine\\s*insurance','all\\s*risks'] },
      { id:'bill_of_exchange', name:'Bill of Exchange', keywords:['bill of exchange','draft','pay to the order','drawer','drawee','payee','at sight','days after sight','acceptance','tenor'], patterns:['bill\\s*of\\s*exchange','pay\\s*to\\s*the\\s*order','at\\s*sight'] },
      { id:'customs_declaration', name:'Customs Declaration', keywords:['customs','customs declaration','import declaration','export declaration','hs code','harmonized','tariff','duty','customs value','clearance'], patterns:['customs\\s*declaration','hs\\s*code','harmonized\\s*system'] },

// ===================== Classifier =====================
window.classifyPage = function(text) {
  // Auto-classify as Blank Page if text is too short
  const trimmed = (text || '').replace(/\s+/g, '').trim();
  if (trimmed.length < 10) {
    return { typeId:'blank_page', typeName:'Blank Page', confidence:0.95, score:20, matchedKeywords:['(blank)'] };
  }

  const training = window.appStore.training;
  const lower = text.toLowerCase();
  const scores = [];

  for (const dt of training.documentTypes) {
    if (dt.id === 'blank_page') continue; // skip blank page in keyword matching
    let score = 0;
    const matched = [];
    for (const kw of dt.keywords) {
      if (lower.includes(kw.toLowerCase())) { score += 2; matched.push(kw); }
    }
    for (const p of dt.patterns) {
      try { if (new RegExp(p, 'i').test(text)) score += 3; } catch {}
    }
    if (score > 0) scores.push({ typeId: dt.id, typeName: dt.name, score, matchedKeywords: matched });
  }

  scores.sort((a, b) => b.score - a.score);
  if (scores.length === 0) return { typeId:'unclassified', typeName:'Unclassified', confidence:0, matchedKeywords:[] };

  const conf = Math.min(0.99, scores[0].score / Math.max(10, scores[0].score * 1.5));
  if (conf < 0.15) return { typeId:'unclassified', typeName:'Unclassified', confidence: conf, matchedKeywords: scores[0].matchedKeywords };

  return { ...scores[0], confidence: conf };
};

window.extractData = function(text, typeId) {
  const rules = extractionRules[typeId];
  if (!rules) return {};
  const result = {};
  for (const field of rules) {
    for (const pattern of field.patterns) {
      const match = text.match(pattern);
      if (match) { result[field.name] = { label: field.label, value: (match[1] || match[0]).trim() }; break; }
    }
  }
  return result;
};

// ===================== OCR Engine =====================
// Minimum character count to consider a page as having a usable text layer
const OCR_TEXT_THRESHOLD = 20;

// Render a single PDF page to an offscreen canvas and return the canvas
async function renderPageToCanvas(pdfPage, scale) {
  const viewport = pdfPage.getViewport({ scale: scale || 2 });
  const canvas = document.createElement('canvas');
  canvas.width = viewport.width;
  canvas.height = viewport.height;
  const ctx = canvas.getContext('2d');
  await pdfPage.render({ canvasContext: ctx, viewport }).promise;
  return canvas;
}

// Run Tesseract OCR on a canvas element and return the extracted text
async function ocrFromCanvas(canvas, onProgress) {
  if (typeof Tesseract === 'undefined') {
    console.warn('Tesseract.js not loaded — OCR unavailable');
    return '';
  }
  try {
    const result = await Tesseract.recognize(canvas, 'eng', {
      logger: m => { if (m.status === 'recognizing text' && onProgress) onProgress(m.progress); }
    });
    return (result.data.text || '').trim();
  } catch (err) {
    console.error('OCR error:', err);
    return '';
  }
}

// Determine if a page needs OCR (text layer is empty or too short)
function pageNeedsOCR(textLayerText) {
  if (!textLayerText) return true;
  const stripped = textLayerText.replace(/\s+/g, '').trim();
  return stripped.length < OCR_TEXT_THRESHOLD;
}

// ===================== Display Formatting =====================
// Format display values: dates, numbers, amounts
function formatDisplayValue(value, label) {
  if (!value || typeof value !== 'string') return value;
  const lbl = (label || '').toLowerCase();

  // Date fields: validate and format
  if (lbl.includes('date') || lbl.includes('expiry') || lbl.includes('issued')) {
    return formatDateValue(value);
  }

  // Amount/Price fields: format with currency and commas
  if (lbl.includes('amount') || lbl.includes('price') || lbl.includes('insured') || lbl.includes('duty')) {
    return formatAmountValue(value);
  }

  // Quantity/Weight/Volume/Packages: format numbers with commas
  if (lbl.includes('quantity') || lbl.includes('weight') || lbl.includes('volume') || lbl.includes('packages') || lbl.includes('qty')) {
    return formatNumberValue(value);
  }

  return value;
}

function formatDateValue(val) {
  // Try to parse common date formats and return consistent format
  const v = val.trim();
  // Already well-formatted: DD/MM/YYYY, MM/DD/YYYY, YYYY-MM-DD
  const isoMatch = v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if (isoMatch) {
    const d = new Date(parseInt(isoMatch[1]), parseInt(isoMatch[2])-1, parseInt(isoMatch[3]));
    if (!isNaN(d.getTime())) return d.toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' });
  }
  const slashMatch = v.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
  if (slashMatch) {
    let day = parseInt(slashMatch[1]), mon = parseInt(slashMatch[2]), yr = parseInt(slashMatch[3]);
    if (yr < 100) yr += 2000;
    const d = new Date(yr, mon-1, day);
    if (!isNaN(d.getTime())) return d.toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' });
  }
  // "15 January 2025" style
  const longMatch = v.match(/^(\d{1,2})\s+(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\s+(\d{2,4})$/i);
  if (longMatch) {
    const months = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
    let yr = parseInt(longMatch[3]); if (yr < 100) yr += 2000;
    const d = new Date(yr, months.indexOf(longMatch[2].toLowerCase().substring(0,3)), parseInt(longMatch[1]));
    if (!isNaN(d.getTime())) return d.toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' });
  }
  return val; // return as-is if can't parse
}

function formatAmountValue(val) {
  const v = val.trim();
  // Extract currency prefix if present (e.g. "USD 50000.00 per MT")
  const currMatch = v.match(/^([A-Z]{3})\s+(.+)$/);
  let currency = '', rest = v;
  if (currMatch) { currency = currMatch[1]; rest = currMatch[2]; }

  // Extract suffix (e.g. "per MT")
  const suffixMatch = rest.match(/^([0-9,.\s]+)\s+(.+)$/);
  let numPart = rest, suffix = '';
  if (suffixMatch) { numPart = suffixMatch[1]; suffix = suffixMatch[2]; }

  // Format the number part with commas
  const num = parseFloat(numPart.replace(/,/g, ''));
  if (!isNaN(num)) {
    const formatted = num.toLocaleString('en-US', { minimumFractionDigits: num % 1 !== 0 ? 2 : 0, maximumFractionDigits: 2 });
    return (currency ? currency + ' ' : '') + formatted + (suffix ? ' ' + suffix : '');
  }
  return val;
}

function formatNumberValue(val) {
  const v = val.trim();
  // Extract numeric part and unit suffix (e.g. "500 MT" or "1000.50 KG")
  const match = v.match(/^([0-9,.\s]+)\s*(.*)$/);
  if (match) {
    const num = parseFloat(match[1].replace(/,/g, ''));
    if (!isNaN(num)) {
      const formatted = num.toLocaleString('en-US', { minimumFractionDigits: num % 1 !== 0 ? 2 : 0, maximumFractionDigits: 2 });
      return formatted + (match[2] ? ' ' + match[2] : '');
    }
  }
  return val;
}

// Date validation helper for input fields
function isValidDate(str) {
  if (!str) return false;
  const v = str.trim();
  // DD/MM/YYYY or DD-MM-YYYY
  if (/^\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4}$/.test(v)) return true;
  // YYYY-MM-DD
  if (/^\d{4}-\d{1,2}-\d{1,2}$/.test(v)) return true;
  // "15 January 2025"
  if (/^\d{1,2}\s+(?:jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\s+\d{2,4}$/i.test(v)) return true;
  return false;
}

// Compliance check engine
function runComplianceChecks() {
  const results = { sanctionedCountries:[], dualUseGoods:[], priceAnomalies:[], shellCompanies:[], redFlags:[] };
  const docs = window.appStore.documents;
  const allNouns = typeof aggregateAllNouns === 'function' ? aggregateAllNouns() : [];

  // 1. Sanctioned Countries
  const addressNouns = allNouns.filter(function(n){ return n.category === 'location' || n.category === 'address'; });
  for (const noun of addressNouns) {
    for (const country of SANCTIONED_COUNTRIES_ALL) {
      if (noun.text.toLowerCase().includes(country.toLowerCase())) {
        const lists = [];
        if (SANCTIONED_COUNTRIES.fatf_blacklist.some(function(c){return c.toLowerCase()===country.toLowerCase();})) lists.push('FATF Black List');
        if (SANCTIONED_COUNTRIES.fatf_greylist.some(function(c){return c.toLowerCase()===country.toLowerCase();})) lists.push('FATF Grey List');
        if (SANCTIONED_COUNTRIES.ofac.some(function(c){return c.toLowerCase()===country.toLowerCase();})) lists.push('OFAC');
        if (SANCTIONED_COUNTRIES.eu.some(function(c){return c.toLowerCase()===country.toLowerCase();})) lists.push('EU Sanctions');
        if (SANCTIONED_COUNTRIES.un.some(function(c){return c.toLowerCase()===country.toLowerCase();})) lists.push('UN Sanctions');
        results.sanctionedCountries.push({ country:country, matchedText:noun.text, lists:lists, severity:lists.includes('FATF Black List')||lists.includes('OFAC')?'high':'medium', occurrences:noun.occurrences });
      }
    }
  }
  // Also check extracted address/country fields directly
  for (const doc of docs) {
    for (const page of doc.pages) {
      const ed = page.extractedData || {};
      const fieldsToCheck = ['countryOfOrigin','portOfLoading','portOfDischarge','location'];
      for (const fn of fieldsToCheck) {
        if (ed[fn]) {
          for (const country of SANCTIONED_COUNTRIES_ALL) {
            if (ed[fn].value.toLowerCase().includes(country.toLowerCase())) {
              const already = results.sanctionedCountries.find(function(s){return s.country===country && s.matchedText===ed[fn].value;});
              if (!already) {
                const lists = [];
                if (SANCTIONED_COUNTRIES.fatf_blacklist.some(function(c){return c.toLowerCase()===country.toLowerCase();})) lists.push('FATF Black List');
                if (SANCTIONED_COUNTRIES.fatf_greylist.some(function(c){return c.toLowerCase()===country.toLowerCase();})) lists.push('FATF Grey List');
                if (SANCTIONED_COUNTRIES.ofac.some(function(c){return c.toLowerCase()===country.toLowerCase();})) lists.push('OFAC');
                if (SANCTIONED_COUNTRIES.eu.some(function(c){return c.toLowerCase()===country.toLowerCase();})) lists.push('EU Sanctions');
                if (SANCTIONED_COUNTRIES.un.some(function(c){return c.toLowerCase()===country.toLowerCase();})) lists.push('UN Sanctions');
                results.sanctionedCountries.push({ country:country, matchedText:ed[fn].value, lists:lists, severity:lists.includes('FATF Black List')||lists.includes('OFAC')?'high':'medium', occurrences:[{docId:doc.id,docName:doc.filename,pageNum:page.pageNum,typeName:page.classification.typeName}] });
              }
            }
          }
        }
      }
    }
  }

  // 2. Dual-Use Goods
  for (const doc of docs) {
    for (const page of doc.pages) {
      const ed = page.extractedData || {};
      if (ed.hsCode) {
        for (const du of DUAL_USE_HS_PREFIXES) {
          if (ed.hsCode.value.replace(/\s/g,'').startsWith(du.prefix)) {
            results.dualUseGoods.push({ type:'hs_code', hsCode:ed.hsCode.value, desc:du.desc, severity:'high', docId:doc.id, docName:doc.filename, pageNum:page.pageNum });
          }
        }
      }
      var textLower = (page.text || '').toLowerCase();
      for (const kw of DUAL_USE_KEYWORDS) {
        if (textLower.includes(kw)) {
          results.dualUseGoods.push({ type:'keyword', keyword:kw, severity:'medium', docId:doc.id, docName:doc.filename, pageNum:page.pageNum });
        }
      }
    }
  }

  // 3. Price Anomalies (use priceData if available) — scan ALL price/amount fields by label
  if (window.priceData && window.priceData.commodities) {
    for (const doc of docs) {
      for (const page of doc.pages) {
        const ed = page.extractedData || {};
        if (!ed || Object.keys(ed).length === 0) continue;

        // Collect all price-like values from any field (handles manual/goods keys)
        const priceFields = [];
        const hsCodeVal = findFieldByLabel(ed, ['hs code', 'hs_code', 'tariff']);
        for (const [key, field] of Object.entries(ed)) {
          const lbl = (field.label || '').toLowerCase();
          if (lbl.includes('amount') || lbl.includes('price') || lbl.includes('total') || lbl.includes('insured') || lbl.includes('duty')) {
            var priceStr = (field.value || '').replace(/[A-Z]{3}\s*/g, '').replace(/,/g, '').replace(/\s*per\s+.*/i, '');
            var price = parseFloat(priceStr.replace(/[^0-9.]/g, ''));
            if (price && price > 0) priceFields.push({ price: price, label: field.label });
          }
        }

        for (const pf of priceFields) {
          // If we have an HS code, only match against its commodity; otherwise check all
          const commoditiesToCheck = [];
          if (hsCodeVal) {
            const matched = window.priceData.commodities.find(function(c) { return hsCodeVal.startsWith(c.hsCode); });
            if (matched) commoditiesToCheck.push(matched);
          }
          if (commoditiesToCheck.length === 0 && !hsCodeVal) {
            // No HS code, check against all commodities for anomalies
            commoditiesToCheck.push.apply(commoditiesToCheck, window.priceData.commodities);
          }

          for (const commodity of commoditiesToCheck) {
            var globalMin = Math.min.apply(null, commodity.prices.map(function(p){return p.min;}));
            var globalMax = Math.max.apply(null, commodity.prices.map(function(p){return p.max;}));
            if (pf.price < globalMin * 0.5) {
              results.priceAnomalies.push({ price:pf.price, commodity:commodity.name, expected:'$'+globalMin.toLocaleString()+' - $'+globalMax.toLocaleString(), variance:((pf.price-globalMin)/globalMin*100).toFixed(1), direction:'under', severity:'high', docId:doc.id, docName:doc.filename, pageNum:page.pageNum, fieldLabel:pf.label });
            } else if (pf.price > globalMax * 2) {
              results.priceAnomalies.push({ price:pf.price, commodity:commodity.name, expected:'$'+globalMin.toLocaleString()+' - $'+globalMax.toLocaleString(), variance:((pf.price-globalMax)/globalMax*100).toFixed(1), direction:'over', severity:'medium', docId:doc.id, docName:doc.filename, pageNum:page.pageNum, fieldLabel:pf.label });
            }
          }
        }
      }
    }
  }

  // 4. Shell Companies
  var corporateNouns = allNouns.filter(function(n){ return n.category === 'entity'; });
  for (const noun of corporateNouns) {
    var flags = [];
    for (const ind of SHELL_COMPANY_INDICATORS) {
      if (ind.test(noun.text)) flags.push(ind.desc);
    }
    if (flags.length >= 2) {
      results.shellCompanies.push({ name:noun.text, indicators:flags, severity:flags.length>=3?'high':'medium', occurrences:noun.occurrences });
    }
  }

  // 5. System Red Flags
  for (const rf of SYSTEM_RED_FLAGS) {
    var flag = { id:rf.id, text:rf.text, auto:true, triggered:false, details:[], sources:[] };
    switch(rf.id) {
      case 'srf01':
        flag.triggered = results.sanctionedCountries.length > 0;
        flag.details = results.sanctionedCountries.map(function(s){return s.country+' ('+s.lists.join(', ')+')';});
        flag.sources = results.sanctionedCountries.map(function(s){
          var occ = s.occurrences && s.occurrences[0] ? s.occurrences[0] : {};
          return {docId:occ.docId||null, docName:occ.docName||s.matchedText, pageNum:occ.pageNum||0, detail:s.country+' ('+s.lists.join(', ')+')'};
        });
        break;
      case 'srf02':
        flag.triggered = results.dualUseGoods.length > 0;
        flag.details = results.dualUseGoods.map(function(d){return d.type==='hs_code'?'HS '+d.hsCode+': '+d.desc:d.keyword;});
        flag.sources = results.dualUseGoods.map(function(d){
          return {docId:d.docId, docName:d.docName, pageNum:d.pageNum, detail:d.type==='hs_code'?'HS '+d.hsCode+': '+d.desc:d.keyword};
        });
        break;
      case 'srf03':
        flag.triggered = results.priceAnomalies.length > 0;
        flag.details = results.priceAnomalies.map(function(p){return p.direction+'pricing: $'+p.price+' vs expected '+p.expected;});
        flag.sources = results.priceAnomalies.map(function(p){
          return {docId:p.docId, docName:p.docName, pageNum:p.pageNum, detail:p.direction+'pricing: $'+p.price+' vs '+p.expected};
        });
        break;
      case 'srf04':
        flag.triggered = results.shellCompanies.length > 0;
        flag.details = results.shellCompanies.map(function(s){return s.name;});
        flag.sources = results.shellCompanies.map(function(s){
          var occ = s.occurrences && s.occurrences[0] ? s.occurrences[0] : {};
          return {docId:occ.docId||null, docName:occ.docName||'', pageNum:occ.pageNum||0, detail:s.name+' ('+s.indicators.join(', ')+')'};
        });
        break;
      case 'srf05':
        var sellers = new Set(), buyers = new Set();
        var sellerSources = {}, buyerSources = {};
        for (const doc of docs) for (const page of doc.pages) {
          if (page.extractedData && page.extractedData.seller) {
            var sv = page.extractedData.seller.value.toLowerCase().trim();
            sellers.add(sv);
            if (!sellerSources[sv]) sellerSources[sv] = [];
            sellerSources[sv].push({docId:doc.id, docName:doc.filename, pageNum:page.pageNum, role:'seller'});
          }
          if (page.extractedData && page.extractedData.buyer) {
            var bv = page.extractedData.buyer.value.toLowerCase().trim();
            buyers.add(bv);
            if (!buyerSources[bv]) buyerSources[bv] = [];
            buyerSources[bv].push({docId:doc.id, docName:doc.filename, pageNum:page.pageNum, role:'buyer'});
          }
        }
        var overlap = Array.from(sellers).filter(function(s){return buyers.has(s);});
        flag.triggered = overlap.length > 0;
        flag.details = overlap;
        flag.sources = [];
        for (var oi = 0; oi < overlap.length; oi++) {
          var entity = overlap[oi];
          var allSrcs = (sellerSources[entity]||[]).concat(buyerSources[entity]||[]);
          for (var si = 0; si < allSrcs.length; si++) {
            flag.sources.push({docId:allSrcs[si].docId, docName:allSrcs[si].docName, pageNum:allSrcs[si].pageNum, detail:entity+' (as '+allSrcs[si].role+')'});
          }
        }
        break;
    }
    results.redFlags.push(flag);
  }

  // 6. User-uploaded red flags auto-response
  var userFlags = window.appStore.userRedFlags || [];
  var allText = docs.map(function(d){return d.pages.map(function(p){return p.text;}).join(' ');}).join(' ').toLowerCase();
  for (const uf of userFlags) {
    var autoResult = null;
    var words = uf.text.toLowerCase().split(/\s+/).filter(function(w){return w.length>3;});
    var matchedWords = words.filter(function(w){return allText.includes(w);});
    if (matchedWords.length > 0 && matchedWords.length >= words.length * 0.3) {
      autoResult = { found:true, evidence:'Keywords found in documents: '+matchedWords.slice(0,5).join(', ') };
    }
    // Check for sanctioned country references
    if (uf.text.toLowerCase().includes('sanction') || uf.text.toLowerCase().includes('country')) {
      if (results.sanctionedCountries.length > 0) autoResult = { found:true, evidence:'Sanctioned countries detected: '+results.sanctionedCountries.map(function(s){return s.country;}).join(', ') };
    }
    results.redFlags.push({ id:uf.id, text:uf.text, auto:false, triggered:!!autoResult, autoResult:autoResult, manualAnswer:window.appStore.manualRedFlags[uf.id] || null, details:autoResult?[autoResult.evidence]:[] });
  }

  return results;
}

window.renderComplianceTab = function() {
  var el = document.getElementById('compliance-tab-content');
  if (!el || !window._complianceResults) return;
  var results = window._complianceResults;
  switch(window._complianceTab) {
    case 'overview': renderCompOverview(el, results); break;
    case 'redflags': renderCompRedFlags(el, results); break;
    case 'sanctions': renderCompSanctions(el, results); break;
    case 'dualuse': renderCompDualUse(el, results); break;
    case 'pricing': renderCompPricing(el, results); break;
    case 'shell': renderCompShell(el, results); break;

  // Update tab button active states
  ['overview','redflags','sanctions','dualuse','pricing','shell'].forEach(function(tid) {
    var btn = document.querySelector('[data-comp-tab="' + tid + '"]');

};

      if (review) {

// Upload Red Flags handler
window.uploadRedFlags = function(input) {
  var file = input.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    var text = e.target.result;
    var lines = text.split(/\r?\n/).map(function(l){return l.trim();}).filter(function(l){return l.length > 0 && !l.startsWith('#');});
    var flags = [];
    for (var i = 0; i < lines.length; i++) {
      // Handle CSV: take first column if comma-separated
      var line = lines[i];
      if (line.indexOf(',') > -1) {
        var parts = line.split(',');
        line = parts[0].replace(/^["']|["']$/g, '').trim();
      }
      if (line.length > 0) {
        flags.push({ id: 'urf_' + Date.now() + '_' + i, text: line });
      }
    }
    window.appStore.userRedFlags = flags;
    saveStore(window.appStore);
    input.value = '';
    window._complianceTab = 'redflags';
    renderCompliance(document.getElementById('main-content'));
  };
  reader.readAsText(file);
};

// Compliance review workflow
window.startComplianceReview = function(flagId, presetStatus) {
  var panel = document.getElementById('review-panel-' + flagId);
  if (!panel) {
    // Find the review section within the flag card and replace it
    var allPanels = document.querySelectorAll('[id^="review-panel-"]');
    // Look for the parent review area
    panel = null;
  }
  // Build inline review form
  var existing = window.appStore.complianceReviews[flagId];
  var formHtml = '<div id="review-panel-' + flagId + '" class="space-y-2">';
  formHtml += '<div class="flex items-center gap-2">';
  formHtml += '<span class="text-[10px] font-semibold text-gray-500 uppercase">Decision:</span>';
  formHtml += '<button onclick="window._reviewStatus[\'' + flagId + '\']=\'approved\'; this.classList.add(\'ring-2\',\'ring-green-400\'); this.nextElementSibling.classList.remove(\'ring-2\',\'ring-red-400\')" class="inline-flex items-center gap-1 px-2.5 py-1 rounded-md text-[11px] font-medium bg-green-50 text-green-700 border border-green-200 hover:bg-green-100 transition-colors ' + (presetStatus === 'approved' ? 'ring-2 ring-green-400' : '') + '">&#10003; Approve</button>';
  formHtml += '<button onclick="window._reviewStatus[\'' + flagId + '\']=\'rejected\'; this.classList.add(\'ring-2\',\'ring-red-400\'); this.previousElementSibling.classList.remove(\'ring-2\',\'ring-green-400\')" class="inline-flex items-center gap-1 px-2.5 py-1 rounded-md text-[11px] font-medium bg-red-50 text-red-700 border border-red-200 hover:bg-red-100 transition-colors ' + (presetStatus === 'rejected' ? 'ring-2 ring-red-400' : '') + '">&#10007; Reject</button>';
  formHtml += '</div>';
  formHtml += '<textarea id="review-comment-' + flagId + '" rows="2" placeholder="Add reviewer comments (optional)..." class="w-full px-3 py-2 border border-gray-200 rounded-lg text-xs text-gray-700 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 resize-none">' + (existing ? existing.comment || '' : '') + '</textarea>';
  formHtml += '<div class="flex items-center gap-2">';
  formHtml += '<button onclick="window.submitComplianceReview(\'' + flagId + '\')" class="px-3 py-1.5 rounded-md text-[11px] font-medium bg-brand-600 text-white hover:bg-brand-700 transition-colors">Submit Review</button>';
  formHtml += '<button onclick="window._complianceTab=\'redflags\'; window.renderComplianceTab();" class="px-3 py-1.5 rounded-md text-[11px] font-medium bg-gray-100 text-gray-600 hover:bg-gray-200 transition-colors">Cancel</button>';
  if (existing) {
    formHtml += '<button onclick="window.clearComplianceReview(\'' + flagId + '\')" class="px-3 py-1.5 rounded-md text-[11px] font-medium bg-red-50 text-red-600 hover:bg-red-100 transition-colors border border-red-200">Clear Review</button>';
  }
  formHtml += '</div></div>';

  // Set initial status
  if (!window._reviewStatus) window._reviewStatus = {};
  window._reviewStatus[flagId] = presetStatus || (existing ? existing.status : null);

  // Replace the review panel content
  var target = document.getElementById('review-panel-' + flagId);
  if (target) {
    target.outerHTML = formHtml;
  } else {
    // Fallback: re-render the whole tab
    window._complianceTab = 'redflags';
    window.renderComplianceTab();
  }
};

window.submitComplianceReview = function(flagId) {
  var status = (window._reviewStatus || {})[flagId];
  if (!status) { alert('Please select Approve or Reject before submitting.'); return; }
  var commentEl = document.getElementById('review-comment-' + flagId);
  var comment = commentEl ? commentEl.value.trim() : '';
  window.appStore.complianceReviews[flagId] = { status: status, comment: comment, timestamp: new Date().toISOString() };
  saveStore(window.appStore);
  window._complianceResults = runComplianceChecks();
  window._complianceTab = 'redflags';
  window.renderComplianceTab();
};

window.clearComplianceReview = function(flagId) {
  delete window.appStore.complianceReviews[flagId];
  saveStore(window.appStore);
  window._complianceResults = runComplianceChecks();
  window._complianceTab = 'redflags';
  window.renderComplianceTab();
};

// Toggle manual red flag answer
window.toggleManualRedFlag = function(flagId, value) {
  if (value === 'clear') {
    delete window.appStore.manualRedFlags[flagId];
  } else {
    var current = window.appStore.manualRedFlags[flagId];
    if (current === value) {
      delete window.appStore.manualRedFlags[flagId];
    } else {
      window.appStore.manualRedFlags[flagId] = value;
    }
  }
  saveStore(window.appStore);
  window._complianceResults = runComplianceChecks();
  window._complianceTab = 'redflags';
  window.renderComplianceTab();
};

window.selectedFile = null;
window.selectedPdfData = null;
window.fileQueue = [];

function handleFiles(fileList) {
  var pdfFiles = Array.from(fileList).filter(function(f) { return f.type === 'application/pdf'; });
  if (pdfFiles.length === 0) { alert('Please select PDF file(s)'); return; }
  window.fileQueue = pdfFiles;
  window.selectedFile = pdfFiles[0];
  document.getElementById('drop-zone').classList.add('hidden');
  document.getElementById('file-info').classList.remove('hidden');
  document.getElementById('upload-btn').classList.remove('hidden');
  if (pdfFiles.length === 1) {
    document.getElementById('file-name').textContent = pdfFiles[0].name;
    document.getElementById('file-size').textContent = (pdfFiles[0].size / 1024 / 1024).toFixed(2) + ' MB';
  } else {
    var totalSize = pdfFiles.reduce(function(sum, f) { return sum + f.size; }, 0);
    document.getElementById('file-name').textContent = pdfFiles.length + ' PDF files selected';
    document.getElementById('file-size').textContent = (totalSize / 1024 / 1024).toFixed(2) + ' MB total';
  }
}

function handleFile(file) {
  if (!file) return;
  handleFiles([file]);
}

window.clearFile = function() {
  window.selectedFile = null;
  window.fileQueue = [];
  document.getElementById('drop-zone').classList.remove('hidden');
  document.getElementById('file-info').classList.add('hidden');
  document.getElementById('upload-btn').classList.add('hidden');
  document.getElementById('upload-result').innerHTML = '';
};

window.processFile = async function() {
  var queue = window.fileQueue && window.fileQueue.length > 0 ? window.fileQueue : (window.selectedFile ? [window.selectedFile] : []);
  if (queue.length === 0) return;
  var btn = document.getElementById('upload-btn');
  var progress = document.getElementById('progress-bar');
  var fill = document.getElementById('progress-fill');
  var result = document.getElementById('upload-result');
  var statusEl = document.getElementById('upload-status');

  btn.disabled = true;
  btn.innerHTML = '<svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg> Processing...';
  progress.classList.remove('hidden');
  function setStatus(msg) { if (statusEl) statusEl.textContent = msg; }

  var allResults = [];

  try {
    for (var qi = 0; qi < queue.length; qi++) {
      var currentFile = queue[qi];
      var fileLabel = queue.length > 1 ? '[' + (qi+1) + '/' + queue.length + '] ' + currentFile.name + ': ' : '';
      var overallBase = (qi / queue.length) * 100;
      var fileShare = 100 / queue.length;

      setStatus(fileLabel + 'Reading PDF...');
      var arrayBuffer = await currentFile.arrayBuffer();
      fill.style.width = (overallBase + fileShare * 0.2) + '%';

      var uint8 = new Uint8Array(arrayBuffer);
      var base64 = btoa(uint8.reduce(function(s, b) { return s + String.fromCharCode(b); }, ''));
      var pdf = await window.pdfjsLib.getDocument({ data: uint8.slice(0) }).promise;
      fill.style.width = (overallBase + fileShare * 0.3) + '%';

      var pages = [];
      var ocrUsed = false;
      for (var i = 1; i <= pdf.numPages; i++) {
        setStatus(fileLabel + 'Analyzing page ' + i + ' of ' + pdf.numPages + '...');
        var page = await pdf.getPage(i);

        var textContent = await page.getTextContent();
        var text = textContent.items.map(function(item) { return item.str; }).join(' ');
        var textSource = 'text-layer';

        if (pageNeedsOCR(text)) {
          setStatus(fileLabel + 'Page ' + i + ': Running OCR...');
          try {
            var ocrCanvas = await renderPageToCanvas(page, 2);
            var ocrText = await ocrFromCanvas(ocrCanvas, function(pct) {
              var bp = overallBase + fileShare * (0.3 + ((i - 1) / pdf.numPages) * 0.65);
              var pp = (pct * fileShare * 0.65) / pdf.numPages;
              fill.style.width = Math.min(overallBase + fileShare * 0.95, bp + pp) + '%';
              setStatus(fileLabel + 'Page ' + i + ': OCR ' + Math.round(pct * 100) + '%...');
            });
            if (ocrText && ocrText.length > text.length) {
              text = ocrText;
              textSource = 'ocr';
              ocrUsed = true;
            }
          } catch (ocrErr) {
            console.error('[OCR] Page ' + i + ' OCR failed:', ocrErr);
          }
        }

        setStatus(fileLabel + 'Page ' + i + ': Classifying & extracting...');
        var classification = window.classifyPage(text);
        var extractedData = classification.typeId !== 'unclassified' ? window.extractData(text, classification.typeId) : {};
        var pageText = text.substring(0, 5000);
        var nouns = identifyNouns(pageText, extractedData);
        pages.push({ pageNum: i, text: pageText, classification: classification, extractedData: extractedData, nouns: nouns, textSource: textSource });
        fill.style.width = (overallBase + fileShare * (0.3 + (i / pdf.numPages) * 0.65)) + '%';
      }

      var doc = {
        id: 'doc_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6),
        filename: currentFile.name,
        uploadDate: new Date().toISOString(),
        totalPages: pdf.numPages,
        fileSize: currentFile.size,
        pages: pages
      };

      await savePdf(doc.id, base64);
      window.appStore.documents.push(doc);
      saveStore(window.appStore);
      allResults.push({ doc: doc, pages: pages, ocrUsed: ocrUsed });
      fill.style.width = ((qi + 1) / queue.length * 100) + '%';
    }

    setStatus('');
    result.innerHTML = allResults.map(function(r) {
      var doc = r.doc; var pages = r.pages; var ocrUsed = r.ocrUsed;
      return '<div class="bg-white rounded-xl shadow-sm border border-green-200 p-5 mt-4 fade-in">' +
        '<div class="flex items-center gap-3 mb-4">' +
          '<svg class="w-6 h-6 text-green-600" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>' +
          '<div><p class="font-semibold text-green-800">Document Processed Successfully</p>' +
          '<p class="text-sm text-green-600">' + doc.filename + ' - ' + doc.totalPages + ' pages analyzed' + (ocrUsed ? ' (OCR used)' : '') + '</p></div>' +
        '</div>' +
        '<div class="space-y-2">' +
          pages.map(function(p) {
            var fieldCount = Object.keys(p.extractedData).length;
            var fieldList = Object.values(p.extractedData).map(function(f) { return f.label + ': ' + f.value; }).slice(0, 3);
            return '<div class="bg-gray-50 rounded-lg p-3">' +
              '<div class="flex items-center justify-between">' +
                '<div class="flex items-center gap-3">' +
                  '<span class="w-7 h-7 bg-green-100 rounded flex items-center justify-center text-xs font-bold text-green-700">' + p.pageNum + '</span>' +
                  '<div><p class="text-sm font-medium text-gray-900">' + p.classification.typeName +
                    (p.textSource === 'ocr' ? ' <span class="ml-1.5 inline-flex items-center px-1.5 py-0.5 rounded text-[9px] font-medium bg-blue-100 text-blue-700">OCR</span>' : '') +
                  '</p><p class="text-xs text-gray-400">' + fieldCount + ' fields extracted</p></div>' +
                '</div>' +
                (p.classification.typeId !== 'unclassified'
                  ? '<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800">' + (p.classification.confidence*100).toFixed(0) + '%</span>'
                  : '<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-yellow-100 text-yellow-800">Needs Training</span>') +
              '</div>' +
              (fieldCount > 0 ? '<div class="mt-2 ml-10 space-y-0.5">' + fieldList.map(function(f) {
                return '<p class="text-[11px] text-gray-500">' + f + '</p>';
              }).join('') + (fieldCount > 3 ? '<p class="text-[10px] text-gray-400">+' + (fieldCount - 3) + ' more fields</p>' : '') + '</div>' : '') +
            '</div>';
          }).join('') +
        '</div>' +
      '</div>';
    }).join('') +
    '<div class="flex gap-3 mt-4">' +
      '<button onclick="navigate(\'documents\')" class="flex-1 bg-brand-600 hover:bg-brand-700 text-white font-medium py-2 rounded-lg text-sm transition-colors">View All Documents</button>' +
      '<button onclick="clearFile();renderUpload(document.getElementById(\'main-content\'))" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium py-2 rounded-lg text-sm transition-colors">Upload More</button>' +
    '</div>';
  } catch (err) {
    result.innerHTML = '<div class="bg-red-50 text-red-600 rounded-lg p-3 mt-4 text-sm">' + err.message + '</div>';
  }

  btn.classList.add('hidden');
};

        <div class="flex items-center gap-1.5 mt-1.5 flex-wrap">
          ${types.slice(0,3).map(t => `<span class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-medium bg-blue-100 text-blue-800">${t}</span>`).join('')}

      </div>

// ===================== Proper Nouns =====================
window._nounFilterCategory = 'all';
window._nounSearchQuery = '';

function renderProperNouns(el) {
  const allNouns = aggregateAllNouns();
  const dupGroups = findDuplicateCandidates(allNouns);

  const filterCat = window._nounFilterCategory || 'all';
  const searchQ = (window._nounSearchQuery || '').toLowerCase();

  // Category counts
  const catCounts = { entity: 0, location: 0, vessel: 0, address: 0 };
  for (const n of allNouns) {
    if (catCounts.hasOwnProperty(n.category)) catCounts[n.category]++;
  }

  let filtered = allNouns;
  if (filterCat !== 'all' && filterCat !== 'duplicates') {
    filtered = allNouns.filter(n => n.category === filterCat);
  }
  if (searchQ) {
    filtered = filtered.filter(n => n.text.toLowerCase().includes(searchQ));
  }

  const catBadgeColors = {
    entity: { bg: '#dbeafe', text: '#1e40af' },
    location: { bg: '#d1fae5', text: '#065f46' },
    vessel: { bg: '#ccfbf1', text: '#115e59' },
    address: { bg: '#f3e8ff', text: '#6b21a8' }
  };

  function catBadge(cat) {
    var c = catBadgeColors[cat] || { bg: '#f3f4f6', text: '#374151' };
    var catLabel = NOUN_CATEGORIES[cat] ? NOUN_CATEGORIES[cat].label : cat;
    return '<span style="background:' + c.bg + ';color:' + c.text + '" class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-semibold uppercase">' + catLabel + '</span>';
  }

  function typeBadge(typeName) {
    return '<span class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-medium bg-blue-100 text-blue-800">' + typeName + '</span>';
  }

  function statCard(label, count, catKey, icon) {
    var isActive = filterCat === catKey;
    var activeCls = isActive ? 'ring-2 ring-brand-500 bg-brand-50' : 'bg-white hover:bg-gray-50';
    return '<div onclick="window._nounFilterCategory=\'' + catKey + '\';renderProperNouns(document.getElementById(\'main-content\'))" class="cursor-pointer rounded-xl shadow-sm border border-gray-100 p-4 text-center transition-all ' + activeCls + '">' +
      '<div class="text-2xl font-bold text-gray-900">' + count + '</div>' +
      '<div class="text-xs text-gray-500 mt-1">' + label + '</div>' +
    '</div>';
  }

  // Build duplicate groups HTML
  var dupHtml = '';
  if (dupGroups.length > 0 && (filterCat === 'all' || filterCat === 'duplicates')) {
    var dupItems = dupGroups.map(function(group, gi) {
      return '<div class="bg-yellow-50 border border-yellow-200 rounded-lg p-3 mb-2">' +
        '<div class="text-xs font-semibold text-yellow-800 mb-2">Possible duplicates (' + group[0].category + '):</div>' +
        '<div class="flex flex-wrap gap-2">' +
        group.map(function(noun, ni) {
          return '<button onclick="consolidateNoun(' + gi + ',' + ni + ')" class="px-3 py-1.5 rounded-lg text-xs font-medium border transition-colors bg-white border-yellow-300 text-yellow-900 hover:bg-yellow-100" title="Click to keep this as canonical form">' +
            noun.text + ' <span class="text-[10px] text-yellow-600">(' + noun.occurrences.length + ')</span></button>';
        }).join('') +
        '</div>' +
      '</div>';
    }).join('');
    dupHtml = '<div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5 mb-6">' +
      '<div class="flex items-center gap-2 mb-3">' +
        '<svg class="w-5 h-5 text-yellow-500" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z"/></svg>' +
        '<h3 class="text-sm font-semibold text-gray-900">Duplicate Candidates</h3>' +
        '<span class="text-xs text-gray-500">(' + dupGroups.length + ' groups)</span>' +
      '</div>' +
      '<p class="text-xs text-gray-500 mb-3">Click a noun to keep it as the canonical form. All other variants will be updated to match.</p>' +
      dupItems +
    '</div>';
  }

  // Build nouns list
  var nounRows = filtered.map(function(noun) {
    var uniqueDocs = [];
    var seen = {};
    for (var i = 0; i < noun.occurrences.length; i++) {
      var o = noun.occurrences[i];
      if (!seen[o.docId]) { seen[o.docId] = true; uniqueDocs.push(o.docId); }
    }
    var occDetails = noun.occurrences.map(function(o) {
      return '<div class="flex items-center gap-2 py-1.5 px-3 text-xs">' +
        typeBadge(o.typeName) +
        '<span class="text-gray-700">' + o.docName + '</span>' +
        '<span class="text-gray-400">Page ' + o.pageNum + '</span>' +
        '<button onclick="navigate(\'document-detail\',\'' + o.docId + '\')" class="text-brand-600 hover:text-brand-700 font-medium ml-auto">Go &rarr;</button>' +
      '</div>';
    }).join('');

    return '<div class="noun-row border-b border-gray-100 last:border-0">' +
      '<div onclick="toggleNounDetail(this.parentElement)" class="flex items-center gap-3 px-4 py-3 hover:bg-gray-50 cursor-pointer transition-colors">' +
        catBadge(noun.category) +
        '<span class="text-sm font-medium text-gray-900 flex-1">' + noun.text + '</span>' +
        (noun.extractedField ? '<span class="text-[10px] text-gray-400 bg-gray-100 rounded px-1.5 py-0.5">' + noun.extractedField + '</span>' : '') +
        '<span class="text-xs text-gray-500">' + noun.occurrences.length + ' occurrence' + (noun.occurrences.length !== 1 ? 's' : '') + ' across ' + uniqueDocs.length + ' doc' + (uniqueDocs.length !== 1 ? 's' : '') + '</span>' +
        '<svg class="w-4 h-4 text-gray-400 transition-transform noun-chevron" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19.5 8.25l-7.5 7.5-7.5-7.5"/></svg>' +
      '</div>' +
      '<div class="noun-detail hidden bg-gray-50 border-t border-gray-100">' +
        occDetails +
      '</div>' +
    '</div>';
  }).join('');

  el.innerHTML =
    '<div class="fade-in space-y-6">' +
      '<div class="flex items-center justify-between flex-wrap gap-3">' +
        '<div>' +
          '<h1 class="text-2xl font-bold text-gray-900">Proper Nouns</h1>' +
          '<p class="text-sm text-gray-500 mt-0.5">' + allNouns.length + ' unique proper nouns found across all documents</p>' +
        '</div>' +
        '<button onclick="exportNounsToExcel()" class="inline-flex items-center gap-2 px-4 py-2 bg-green-600 hover:bg-green-700 text-white font-medium rounded-lg text-sm transition-colors shadow-sm">' +
          '<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3"/></svg>' +
          'Export Excel' +
        '</button>' +
      '</div>' +

      '<div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3">' +
        statCard('All', allNouns.length, 'all') +
        statCard('Entity Names', catCounts.entity, 'entity') +
        statCard('Locations', catCounts.location, 'location') +
        statCard('Vessel Names', catCounts.vessel, 'vessel') +
        statCard('Address', catCounts.address, 'address') +
        statCard('Duplicates', dupGroups.length, 'duplicates') +
      '</div>' +

      '<div class="flex items-center gap-2">' +
        '<input type="text" id="noun-search" placeholder="Search nouns..." value="' + (searchQ || '') + '" oninput="window._nounSearchQuery=this.value;renderProperNouns(document.getElementById(\'main-content\'))" class="flex-1 max-w-sm px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-500 outline-none text-sm">' +
      '</div>' +

      dupHtml +

      (filtered.length === 0
        ? '<div class="bg-white rounded-xl shadow-sm border border-gray-100 p-12 text-center">' +
            '<svg class="w-12 h-12 text-gray-300 mx-auto mb-3" fill="none" stroke="currentColor" stroke-width="1" viewBox="0 0 24 24"><path d="M15 19.128a9.38 9.38 0 002.625.372 9.337 9.337 0 004.121-.952 4.125 4.125 0 00-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 018.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0111.964-3.07M12 6.375a3.375 3.375 0 11-6.75 0 3.375 3.375 0 016.75 0zm8.25 2.25a2.625 2.625 0 11-5.25 0 2.625 2.625 0 015.25 0z"/></svg>' +
            '<p class="text-sm text-gray-500">No proper nouns found. Upload and classify documents to extract nouns.</p>' +
            '<button onclick="navigate(\'upload\')" class="bg-brand-600 hover:bg-brand-700 text-white font-medium px-4 py-2 rounded-lg text-sm mt-3 transition-colors">Upload Document</button>' +
          '</div>'
        : '<div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">' +
            '<div class="px-4 py-3 border-b border-gray-100 flex items-center justify-between">' +
              '<span class="text-sm font-semibold text-gray-700">Nouns (' + filtered.length + ')</span>' +
            '</div>' +
            nounRows +
          '</div>'
      ) +
    '</div>';
}

window.toggleNounDetail = function(row) {

  var chevron = row.querySelector('.noun-chevron');
  if (detail) {
    detail.classList.toggle('hidden');
    if (chevron) chevron.style.transform = detail.classList.contains('hidden') ? '' : 'rotate(180deg)';
  }
};

window.consolidateNoun = function(groupIndex, selectedIndex) {
  var allNouns = aggregateAllNouns();
  var dupGroups = findDuplicateCandidates(allNouns);
  if (groupIndex >= dupGroups.length) return;
  var group = dupGroups[groupIndex];
  if (selectedIndex >= group.length) return;
  var canonical = group[selectedIndex].text;

  // Update all variant noun texts to canonical form across all docs
  for (var v = 0; v < group.length; v++) {
    if (v === selectedIndex) continue;
    var variantText = group[v].text;
    for (var d = 0; d < window.appStore.documents.length; d++) {
      var doc = window.appStore.documents[d];
      for (var pg = 0; pg < doc.pages.length; pg++) {
        var page = doc.pages[pg];
        if (!page.nouns) continue;
        for (var ni = 0; ni < page.nouns.length; ni++) {
          if (page.nouns[ni].text.trim().toLowerCase() === variantText.trim().toLowerCase()) {
            page.nouns[ni].text = canonical;
          }
        }
      }
    }
  }

  // Save consolidation record
  window.appStore.nounConsolidations.push({
    canonical: canonical,
    variants: group.map(function(g) { return g.text; }),
    date: new Date().toISOString()
  });

  saveStore(window.appStore);
  renderProperNouns(document.getElementById('main-content'));
};

window.exportNounsToExcel = function() {
  if (typeof XLSX === 'undefined') { alert('SheetJS library not loaded. Please check your internet connection.'); return; }
  const allNouns = aggregateAllNouns();

  // Sheet 1: Full list — one row per occurrence
  const fullRows = [];
  for (const noun of allNouns) {
    for (const occ of noun.occurrences) {
      fullRows.push({
        'Category': (NOUN_CATEGORIES[noun.category] || { label: noun.category }).label,
        'Noun': noun.text,
        'Source': 'P' + occ.pageNum + ' - ' + occ.typeName + ' (' + occ.docName + ')'
      });
    }
  }

  // Sheet 2: Deduplicated/unique nouns — one row per unique noun
  const uniqueRows = allNouns.map(noun => ({
    'Category': (NOUN_CATEGORIES[noun.category] || { label: noun.category }).label,
    'Noun': noun.text,
    'Source': noun.occurrences.map(o => 'P' + o.pageNum + ' - ' + o.typeName + ' (' + o.docName + ')').join('; ')
  }));

  const wb = XLSX.utils.book_new();

  const ws1 = XLSX.utils.json_to_sheet(fullRows);
  ws1['!cols'] = [{ wch: 18 }, { wch: 40 }, { wch: 50 }];
  XLSX.utils.book_append_sheet(wb, ws1, 'All Nouns');

  const ws2 = XLSX.utils.json_to_sheet(uniqueRows);
  ws2['!cols'] = [{ wch: 18 }, { wch: 40 }, { wch: 60 }];
  XLSX.utils.book_append_sheet(wb, ws2, 'Unique Nouns');

  XLSX.writeFile(wb, 'TradeDOC_Nouns_' + new Date().toISOString().slice(0, 10) + '.xlsx');
};

function renderDocumentDetail(el) {
  const doc = window.appStore.documents.find(d => d.id === window.currentDocId);
  if (!doc) { el.innerHTML = '<p class="text-gray-500">Document not found</p>'; return; }

  const page = doc.pages.find(p => p.pageNum === window.activePageNum) || doc.pages[0];
  if (!page) return;
  window.activePageNum = page.pageNum;
  const isClassified = page.classification.typeId !== 'unclassified';
  const types = window.appStore.training.documentTypes;

window._pdfCache = { docId: null, pdf: null };
window._pdfZoom = 1.0;
window._pdfRotation = 0;
window._highlightMode = false;

window.pdfZoom = function(delta) {
  window._pdfZoom = Math.max(0.5, Math.min(3.0, (window._pdfZoom || 1) + delta));
  const doc = window.appStore.documents.find(d => d.id === window.currentDocId);
  if (doc) renderPdfPage(doc, window.activePageNum);
  const disp = document.getElementById('zoom-display');
  if (disp) disp.textContent = Math.round(window._pdfZoom * 100) + '%';
};

window.pdfRotate = function() {
  window._pdfRotation = ((window._pdfRotation || 0) + 90) % 360;
  const doc = window.appStore.documents.find(d => d.id === window.currentDocId);
  if (doc) renderPdfPage(doc, window.activePageNum);
};

window.toggleHighlightMode = function() {
  window._highlightMode = !window._highlightMode;
  const btn = document.getElementById('highlight-mode-btn');
  if (btn) {
    if (window._highlightMode) {
      btn.classList.add('bg-yellow-100', 'text-yellow-700', 'ring-1', 'ring-yellow-400');
      btn.classList.remove('text-gray-600');
      setupHighlightOverlay();
    } else {
      btn.classList.remove('bg-yellow-100', 'text-yellow-700', 'ring-1', 'ring-yellow-400');
      btn.classList.add('text-gray-600');
      removeHighlightOverlay();
    }
  }
};

function setupHighlightOverlay() {
  removeHighlightOverlay();
  const wrapper = document.getElementById('pdf-canvas-wrapper');
  const canvas = document.getElementById('pdf-canvas');
  if (!wrapper || !canvas) return;

  const overlay = document.createElement('div');
  overlay.id = 'highlight-overlay';
  overlay.style.cssText = 'position:absolute;top:0;left:0;width:' + canvas.clientWidth + 'px;height:' + canvas.clientHeight + 'px;cursor:crosshair;z-index:10;';
  wrapper.appendChild(overlay);

  const rect = document.createElement('div');
  rect.id = 'highlight-rect';
  rect.style.cssText = 'position:absolute;border:2px solid #f59e0b;background:rgba(245,158,11,0.15);display:none;pointer-events:none;z-index:11;';
  overlay.appendChild(rect);

  let start = null;
  overlay.addEventListener('pointerdown', function(e) {
    e.preventDefault();
    overlay.setPointerCapture(e.pointerId);
    const r = overlay.getBoundingClientRect();
    start = { x: e.clientX - r.left, y: e.clientY - r.top };
    rect.style.display = 'block';
    rect.style.left = start.x + 'px';
    rect.style.top = start.y + 'px';
    rect.style.width = '0';
    rect.style.height = '0';
  });
  overlay.addEventListener('pointermove', function(e) {
    if (!start) return;
    const r = overlay.getBoundingClientRect();
    const cx = e.clientX - r.left, cy = e.clientY - r.top;
    rect.style.left = Math.min(start.x, cx) + 'px';
    rect.style.top = Math.min(start.y, cy) + 'px';
    rect.style.width = Math.abs(cx - start.x) + 'px';
    rect.style.height = Math.abs(cy - start.y) + 'px';
  });
  overlay.addEventListener('pointerup', function(e) {
    if (!start) return;
    const r = overlay.getBoundingClientRect();
    const cx = e.clientX - r.left, cy = e.clientY - r.top;
    const bx = Math.min(start.x, cx), by = Math.min(start.y, cy);
    const bw = Math.abs(cx - start.x), bh = Math.abs(cy - start.y);
    start = null;
    rect.style.display = 'none';

    if (bw < 5 || bh < 5) return; // too small

    // Convert CSS pixels to canvas pixels
    const displayScale = canvas.width / canvas.clientWidth;
    const annX = bx * displayScale, annY = by * displayScale;
    const annW = bw * displayScale, annH = bh * displayScale;
    const effScale = 1.3 * (window._pdfZoom || 1);

    showAnnotationForm(annX, annY, annW, annH, effScale);
  });
}

window.saveAnnotation = function(x, y, w, h, scale) {
  const label = (document.getElementById('ann-label')?.value || '').trim();
  const color = document.getElementById('ann-color')?.value || '#f59e0b';
  const comment = (document.getElementById('ann-comment')?.value || '').trim();

  const doc = window.appStore.documents.find(d => d.id === window.currentDocId);
  if (!doc) return;
  const page = doc.pages.find(p => p.pageNum === window.activePageNum);
  if (!page) return;
  if (!page.annotations) page.annotations = [];

  page.annotations.push({
    id: 'ann_' + Date.now(),
    x: x, y: y, w: w, h: h, scale: scale,
    color: color, label: label, comment: comment,
    createdAt: new Date().toISOString()
  });

  saveStore(window.appStore);
  const panel = document.getElementById('annotation-panel');
  if (panel) { panel.classList.add('hidden'); panel.innerHTML = ''; }
  renderPdfPage(doc, window.activePageNum);
};

window.deleteAnnotation = function(annId) {
  const doc = window.appStore.documents.find(d => d.id === window.currentDocId);
  if (!doc) return;
  const page = doc.pages.find(p => p.pageNum === window.activePageNum);
  if (!page || !page.annotations) return;
  page.annotations = page.annotations.filter(a => a.id !== annId);
  saveStore(window.appStore);
  renderPdfPage(doc, window.activePageNum);
  toggleAnnotationPanel(); // refresh panel
  toggleAnnotationPanel();
};

async function renderPdfPage(doc, pageNum) {
  try {
    // Cancel any in-progress render to avoid "Cannot use the same canvas" error
    if (window._pdfRenderTask) {
      try { window._pdfRenderTask.cancel(); } catch(e) {}
      window._pdfRenderTask = null;
    }
    let pdf;
    if (window._pdfCache.docId === doc.id && window._pdfCache.pdf) {
      pdf = window._pdfCache.pdf;
    } else {
      const base64 = await loadPdf(doc.id);
      if (!base64) { console.error('PDF not found in storage'); return; }
      const raw = atob(base64);
      const arr = new Uint8Array(raw.length);
      for (let i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
      pdf = await window.pdfjsLib.getDocument({ data: arr.slice(0) }).promise;
      window._pdfCache = { docId: doc.id, pdf };
    }
    const page = await pdf.getPage(pageNum);
    const canvas = document.getElementById('pdf-canvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const effectiveScale = 1.3 * (window._pdfZoom || 1.0);
    const rotation = window._pdfRotation || 0;
    const viewport = page.getViewport({ scale: effectiveScale, rotation: rotation });
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    // At base zoom (1.0), fit to container; at other zoom levels, use actual pixel size
    const currentZoom = window._pdfZoom || 1.0;
    if (currentZoom <= 1.0) {
      canvas.style.maxWidth = '100%';
      canvas.style.height = 'auto';
    } else {
      canvas.style.maxWidth = 'none';
      canvas.style.height = 'auto';
    }
    const renderTask = page.render({ canvasContext: ctx, viewport });
    window._pdfRenderTask = renderTask;
    await renderTask.promise;
    window._pdfRenderTask = null;

    // Draw highlights for manually-selected nouns
    const pageData = doc.pages.find(p => p.pageNum === pageNum);
    if (pageData && pageData.nouns) {
      const manualNouns = pageData.nouns.filter(n => n.source === 'manual' && n.bounds);
      const catColors = { entity:'#2563eb', location:'#059669', vessel:'#0d9488', number:'#ea580c', address:'#7c3aed' };
      for (const noun of manualNouns) {
        ctx.strokeStyle = catColors[noun.category] || '#3b82f6';
        ctx.lineWidth = 2;
        ctx.setLineDash([4, 2]);
        ctx.strokeRect(noun.bounds.x, noun.bounds.y, noun.bounds.w, noun.bounds.h);
        ctx.setLineDash([]);
      }
    }

    // Draw annotations (highlights, labels, comments)
    if (pageData && pageData.annotations) {
      for (const ann of pageData.annotations) {
        // Scale annotation coordinates
        const sx = ann.x * (effectiveScale / ann.scale);
        const sy = ann.y * (effectiveScale / ann.scale);
        const sw = ann.w * (effectiveScale / ann.scale);
        const sh = ann.h * (effectiveScale / ann.scale);
        // Semi-transparent fill
        ctx.fillStyle = (ann.color || '#fbbf24') + '40';
        ctx.fillRect(sx, sy, sw, sh);
        // Border
        ctx.strokeStyle = ann.color || '#fbbf24';
        ctx.lineWidth = 2;
        ctx.setLineDash([]);
        ctx.strokeRect(sx, sy, sw, sh);
        // Label text
        if (ann.label) {
          ctx.font = 'bold ' + Math.max(10, 11 * effectiveScale / 1.3) + 'px Inter, sans-serif';
          ctx.fillStyle = ann.color || '#fbbf24';
          const labelW = ctx.measureText(ann.label).width + 8;
          ctx.fillStyle = '#ffffffdd';
          ctx.fillRect(sx, sy - Math.max(14, 16 * effectiveScale / 1.3), labelW, Math.max(14, 16 * effectiveScale / 1.3));
          ctx.fillStyle = ann.color || '#b45309';
          ctx.fillText(ann.label, sx + 4, sy - 4);
        }
        // Comment indicator
        if (ann.comment) {
          ctx.fillStyle = '#ffffffdd';
          ctx.fillRect(sx + sw - 14, sy, 14, 14);
          ctx.fillStyle = '#6b7280';
          ctx.font = '10px sans-serif';
          ctx.fillText('💬', sx + sw - 13, sy + 11);
        }
      }
    }

    // Update zoom display
    const zoomDisp = document.getElementById('zoom-display');
    if (zoomDisp) zoomDisp.textContent = Math.round(window._pdfZoom * 100) + '%';
  } catch (err) {
    // Suppress cancellation errors (expected when re-rendering quickly)
    if (err && err.name === 'RenderingCancelledException') return;
    if (err && err.message && err.message.includes('multiple render')) return;
    console.error('PDF render error:', err);
  }
}

const COUNTRIES = ['China','India','Japan','United States','USA','United Kingdom','UK','Germany','France','Brazil','Indonesia','Malaysia','Thailand','Vietnam','Singapore','South Korea','Korea','Taiwan','Philippines','Australia','New Zealand','Canada','Mexico','Turkey','Saudi Arabia','UAE','United Arab Emirates','Egypt','Nigeria','South Africa','Russia','Pakistan','Bangladesh','Sri Lanka','Myanmar','Netherlands','Belgium','Italy','Spain','Portugal','Switzerland','Sweden','Norway','Denmark','Finland','Poland','Austria','Greece','Ireland','Argentina','Chile','Colombia','Peru','Kenya','Ghana','Morocco','Iran','Iraq','Kuwait','Qatar','Bahrain','Oman','Jordan','Lebanon','Israel','Cambodia','Laos','Czech Republic','Hungary','Romania','Croatia','Hong Kong','Macau'];

const PORTS = ['Shanghai','Singapore','Shenzhen','Ningbo','Busan','Hong Kong','Guangzhou','Qingdao','Dubai','Tianjin','Rotterdam','Antwerp','Xiamen','Kaohsiung','Dalian','Hamburg','Los Angeles','Long Beach','Ho Chi Minh','New York','Colombo','Felixstowe','Piraeus','Valencia','Barcelona','Genoa','Jeddah','Karachi','Mumbai','Chennai','Chittagong','Yokohama','Tokyo','Kobe','Manila','Jakarta','Surabaya','Laem Chabang','Port Klang','Tanjung Pelepas'];

function detectNumbers(text) {
  const results = [];
  const seen = new Set();
  const patterns = [
    /(?:USD|EUR|GBP|JPY|CNY|INR|AED|SGD|CHF|CAD|AUD|HKD)\s*[0-9,]+(?:\.\d{1,2})?/gi,
    /\d{1,2}[\/-]\d{1,2}[\/-]\d{2,4}/g,
    /\d{1,2}\s+(?:January|February|March|April|May|June|July|August|September|October|November|December|Jan|Feb|Mar|Apr|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\s+\d{2,4}/gi,
    /\b(?:INV|B\/L|BL|CO|LC|L\/C|REF|PO|SO|DO|PI|CI|PL|AWB|MAWB|HAWB)[\s\-#:]+[A-Z0-9\-\/]{3,20}/gi,
    /[A-Z]{4}\d{7}/g,
    /(?:HS\s*Code|tariff)[\s:]*\d{4,10}/gi,
    /\d+(?:\.\d+)?\s*%/g,
    /\b\d{1,3}(?:,\d{3})+(?:\.\d{1,2})?\b/g
  ];
  for (const re of patterns) {
    let m; while ((m = re.exec(text)) !== null) {
      const v = m[0].trim();
      if (v.length >= 3 && !seen.has(v)) { seen.add(v); results.push(v); }
    }
  }
  return results;
}

function detectVessels(text) {
  const results = [], seen = new Set();
  const noVessel = /\b(?:unit|price|amount|total|weight|gross|net|quantity|number|terms|payment|date|code)\b/i;
  const patterns = [
    /(?:M\.?V\.?\s|MV\s|S\.?S\.?\s|SS\s)[A-Z][A-Za-z\s\-]{2,25}/g,
    /(?:vessel|ship|motor\s*vessel)\s*(?:name)?[\s:]+([A-Z][A-Za-z\s\-]{2,30})/gi
  ];
  for (const re of patterns) {
    let m; while ((m = re.exec(text)) !== null) {
      const v = (m[1] || m[0]).trim();
      if (v.length >= 5 && !seen.has(v) && !noVessel.test(v)) { seen.add(v); results.push(v); }
    }
  }
  return results;
}

function detectLocations(text) {
  const results = [], seen = new Set();
  // Port of X
  const portOf = text.match(/Port\s+of\s+[A-Z][A-Za-z\s]{2,20}/gi) || [];
  portOf.forEach(v => { v = v.trim(); if (!seen.has(v)) { seen.add(v); results.push(v); } });
  // Known countries in text
  for (const c of COUNTRIES) {
    const re = new RegExp('\\b' + c.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'gi');
    if (re.test(text) && !seen.has(c)) { seen.add(c); results.push(c); }
  }
  // Known ports
  for (const p of PORTS) {
    const re = new RegExp('\\b' + p.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'gi');
    if (re.test(text) && !seen.has(p)) { seen.add(p); results.push(p); }
  }
  return results;
}

function detectAddresses(text) {
  const results = [], seen = new Set();
  // City, Country composite patterns only
  const noAddr = /\b(?:buyer|seller|exporter|importer|shipper|consignee|payment|invoice|date|vessel|port|container|total|amount|currency|description|quantity)\b/i;
  const cityCountry = text.match(/[A-Z][a-z]+(?:\s+[A-Z][a-z]+)?,\s*[A-Z][a-z]+(?:\s+[A-Z][a-z]+)?/g) || [];
  cityCountry.forEach(v => { v = v.trim(); if (v.length > 5 && !seen.has(v) && !noAddr.test(v)) { seen.add(v); results.push(v); } });
  return results;
}

function detectCorporates(text) {
  const results = [], seen = new Set();
  const suffixRe = /[A-Z][A-Za-z&\s\.]{2,40}\s+(?:Ltd\.?|Limited|Co\.?|Corp\.?|Corporation|Inc\.?|Incorporated|S\.A\.?|GmbH|PLC|LLC|LLP|Pte\.?\s*Ltd\.?|Pvt\.?\s*Ltd\.?|Company|Group|Bank|Association|Chamber|Holdings|Industries|Enterprises)\b/g;
  let m; while ((m = suffixRe.exec(text)) !== null) {
    let v = m[0].trim();
    // Trim leading non-name words
    v = v.replace(/^(?:from|the|by|of|and|or|to)\s+/i, '').trim();
    if (v.length >= 5 && v.length <= 60 && /^[A-Z]/.test(v) && !seen.has(v)) { seen.add(v); results.push(v); }
  }
  return results;
}

function detectIndividuals(text) {
  const results = [], seen = new Set();
  const titleRe = /(?:Mr\.?|Mrs\.?|Ms\.?|Miss|Dr\.?|Capt\.?|Prof\.?|Captain|Director)\s+[A-Z][a-z]+(?:\s+[A-Z][a-z]+){0,3}/g;
  let m; while ((m = titleRe.exec(text)) !== null) {
    const v = m[0].trim();
    if (!seen.has(v)) { seen.add(v); results.push(v); }
  }
  const labelRe = /(?:inspector|signed\s*by|authorized\s*by|prepared\s*by|approved\s*by|contact\s*(?:person)?|attention|attn)[\s:]+([A-Z][a-z]+(?:\s+[A-Z][a-z]+){0,3})/gi;
  while ((m = labelRe.exec(text)) !== null) {
    const v = (m[1] || m[0]).trim();
    if (!seen.has(v)) { seen.add(v); results.push(v); }
  }
  return results;
}

function getSemanticCategory(fieldName) {
  for (const [catId, cat] of Object.entries(SEMANTIC_CATEGORIES)) {
    if (cat.fields.includes(fieldName)) return { id: catId, ...cat };
  }
  return { id: 'other', label: 'Other', bgLight: '#f9fafb', textDark: '#374151', dot: '#6b7280' };
}

function nounsFromExtractedData(extractedData) {
  const nouns = [];
  let idx = 0;
  for (const [fieldName, fieldData] of Object.entries(extractedData)) {
    const category = FIELD_TO_NOUN_CATEGORY[fieldName] || 'number';
    const value = (typeof fieldData.value === 'string') ? fieldData.value.trim() : String(fieldData.value);
    if (value.length < 2) continue;
    nouns.push({
      id: 'ne_' + Date.now() + '_' + (idx++),
      text: value,
      category: category,
      source: 'extracted',
      extractedField: fieldData.label
    });
  }
  return nouns;
}

function identifyNouns(text, extractedData) {
  if (!text && !extractedData) return [];
  const nouns = [];
  let idx = 0;
  const mkId = () => 'n_' + Date.now() + '_' + (idx++);
  const used = new Set();

  // First: add nouns from extracted data fields (these show the key-value relationship)
  if (extractedData && Object.keys(extractedData).length > 0) {
    const extractedNouns = nounsFromExtractedData(extractedData);
    for (const noun of extractedNouns) {
      const key = noun.text.toLowerCase();
      if (!used.has(key)) { used.add(key); nouns.push(noun); }
    }
  }

  // Then: add regex-detected nouns (skip duplicates of extracted values)
  if (text) {
    const addAll = (items, cat) => {
      for (const t of items) {
        if (!used.has(t.toLowerCase())) { used.add(t.toLowerCase()); nouns.push({ id: mkId(), text: t, category: cat, source: 'auto' }); }
      }
    };
    addAll(detectNumbers(text), 'number');
    addAll(detectVessels(text), 'vessel');
    addAll(detectLocations(text), 'location');
    addAll(detectAddresses(text), 'address');
    addAll(detectCorporates(text), 'entity');
    addAll(detectIndividuals(text), 'entity');
  }
  return nouns;
}

// ===================== Noun Aggregation & Deduplication =====================
function aggregateAllNouns() {
  const nounMap = {};
  for (const doc of window.appStore.documents) {
    for (const page of doc.pages) {
      for (const noun of (page.nouns || [])) {
        if (noun.category === 'number') continue; // Skip numbers for proper noun aggregation
        const key = noun.text.trim().toLowerCase();
        if (!nounMap[key]) {
          nounMap[key] = { text: noun.text, category: noun.category, source: noun.source, extractedField: noun.extractedField || null, occurrences: [] };
        }
        nounMap[key].occurrences.push({ docId: doc.id, docName: doc.filename, pageNum: page.pageNum, typeName: page.classification.typeName });
      }
    }
  }
  return Object.values(nounMap).sort((a, b) => b.occurrences.length - a.occurrences.length);
}

function levenshtein(a, b) {
  const m = a.length, n = b.length;
  const dp = Array.from({length: m + 1}, () => Array(n + 1).fill(0));
  for (let i = 0; i <= m; i++) dp[i][0] = i;
  for (let j = 0; j <= n; j++) dp[0][j] = j;
  for (let i = 1; i <= m; i++)
    for (let j = 1; j <= n; j++)
      dp[i][j] = Math.min(dp[i-1][j] + 1, dp[i][j-1] + 1, dp[i-1][j-1] + (a[i-1] !== b[j-1] ? 1 : 0));
  return dp[m][n];
}

function isSimilar(a, b) {
  const na = a.toLowerCase().replace(/[^a-z0-9]/g, '');
  const nb = b.toLowerCase().replace(/[^a-z0-9]/g, '');
  if (na === nb) return true;
  if (na.length > 4 && nb.length > 4 && (na.includes(nb) || nb.includes(na))) return true;
  if (Math.abs(na.length - nb.length) <= 3 && na.length > 5) return levenshtein(na, nb) <= 3;
  return false;
}

function findDuplicateCandidates(allNouns) {
  const groups = [];
  const used = new Set();
  for (let i = 0; i < allNouns.length; i++) {
    if (used.has(i)) continue;
    const group = [allNouns[i]];
    used.add(i);
    for (let j = i + 1; j < allNouns.length; j++) {
      if (used.has(j)) continue;
      if (allNouns[i].category !== allNouns[j].category) continue;
      if (isSimilar(allNouns[i].text, allNouns[j].text)) { group.push(allNouns[j]); used.add(j); }
    }
    if (group.length > 1) groups.push(group);
  }
  return groups;
}

// Stop words to exclude from auto-training
const STOP_WORDS = new Set(['the','and','for','that','this','with','from','have','been','will','would','could','should','shall','also','into','only','such','than','then','their','there','they','them','these','those','what','when','where','which','while','about','above','after','before','between','both','each','other','some','most','more','very','just','over','under','same','your','name','number','date','page','total','amount','value','item','unit','type','code','list','note','notes','copy','signed','details','address','description','company','international','trade','trading','limited','corp','corporation','group','port','cargo','goods','document','please','dear','reference','regarding','subject','hereby','attached','letter']);

function extractTrainingKeywords(text) {
  const lower = text.toLowerCase();
  const words = lower.split(/\s+/).filter(w => w.length > 4 && !STOP_WORDS.has(w) && /^[a-z]+$/.test(w));
  // Extract bigrams (two-word phrases) which are more distinctive
  const tokens = lower.split(/\s+/);
  const bigrams = [];
  for (let i = 0; i < tokens.length - 1; i++) {
    const bg = tokens[i] + ' ' + tokens[i+1];
    if (tokens[i].length > 2 && tokens[i+1].length > 2 && !STOP_WORDS.has(tokens[i]) && !STOP_WORDS.has(tokens[i+1])) {
      bigrams.push(bg);
    }
  }
  // Count frequencies
  const freq = {};
  words.forEach(w => { freq[w] = (freq[w]||0)+1; });
  bigrams.forEach(bg => { freq[bg] = (freq[bg]||0)+2; }); // Bigrams weighted higher
  return Object.entries(freq).sort((a,b) => b[1]-a[1]).slice(0,10).map(([w]) => w);
}

window.reclassifyCurrentPage = function() {
  const typeId = document.getElementById('reclassify-select').value;
  if (!typeId) return;

  const doc = window.appStore.documents.find(d => d.id === window.currentDocId);
  if (!doc) return;
  const page = doc.pages.find(p => p.pageNum === window.activePageNum);
  if (!page) return;

  const dt = window.appStore.training.documentTypes.find(d => d.id === typeId);
  page.classification = { typeId, typeName: dt.name, confidence: 1.0, matchedKeywords: ['manual'] };
  page.extractedData = window.extractData(page.text, typeId);

  // Re-identify nouns with new extracted data (preserve manual nouns)
  const manualNouns = (page.nouns || []).filter(n => n.source === 'manual');
  page.nouns = [...identifyNouns(page.text, page.extractedData), ...manualNouns];

  // Auto-train: learn meaningful keywords from this page
  const newKeywords = extractTrainingKeywords(page.text).filter(w => !dt.keywords.includes(w));
  dt.keywords.push(...newKeywords);

  saveStore(window.appStore);
  renderDocumentDetail(document.getElementById('main-content'));
};

// Run OCR on the current page (for scanned documents)
window.runOCROnCurrentPage = async function() {
  const doc = window.appStore.documents.find(d => d.id === window.currentDocId);
  if (!doc) return;
  const page = doc.pages.find(p => p.pageNum === window.activePageNum);
  if (!page) return;

  const btn = document.getElementById('ocr-btn');
  if (btn) { btn.disabled = true; btn.innerHTML = '<svg class="w-3 h-3 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg> Running OCR...'; }
  const msgEl = document.getElementById('noun-message');
  if (msgEl) msgEl.innerHTML = '<p class="text-xs text-blue-600">Running OCR — this may take 10-30 seconds...</p>';

  try {
    let pdf;
    if (window._pdfCache.docId === doc.id && window._pdfCache.pdf) {
      pdf = window._pdfCache.pdf;
    } else {
      const base64 = await loadPdf(doc.id);
      if (!base64) { alert('PDF data not found'); return; }
      const raw = atob(base64);
      const arr = new Uint8Array(raw.length);
      for (let i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
      pdf = await window.pdfjsLib.getDocument({ data: arr.slice(0) }).promise;
      window._pdfCache = { docId: doc.id, pdf };
    }

    const pdfPage = await pdf.getPage(window.activePageNum);
    const ocrCanvas = await renderPageToCanvas(pdfPage, 2);
    const ocrText = await ocrFromCanvas(ocrCanvas, (pct) => {
      if (msgEl) msgEl.innerHTML = '<p class="text-xs text-blue-600">OCR progress: ' + Math.round(pct * 100) + '%</p>';
    });

    if (ocrText && ocrText.length > 10) {
      page.text = ocrText.substring(0, 5000);
      page.textSource = 'ocr';

      // Re-classify and re-extract
      const classification = window.classifyPage(page.text);
      if (classification.typeId !== 'unclassified') {
        page.classification = classification;
        page.extractedData = window.extractData(page.text, classification.typeId);
      } else if (page.classification.typeId !== 'unclassified') {
        // Keep existing classification, just re-extract
        page.extractedData = window.extractData(page.text, page.classification.typeId);
      }

      // Re-identify nouns (preserve manual nouns)
      const manualNouns = (page.nouns || []).filter(n => n.source === 'manual');
      page.nouns = [...identifyNouns(page.text, page.extractedData), ...manualNouns];

      saveStore(window.appStore);
      renderDocumentDetail(document.getElementById('main-content'));
    } else {
      if (msgEl) msgEl.innerHTML = '<p class="text-xs text-red-500">OCR could not extract text from this page. The image may be too low quality.</p>';
      if (btn) { btn.disabled = false; btn.innerHTML = 'Run OCR'; }
    }
  } catch (err) {
    console.error('OCR error:', err);
    if (msgEl) msgEl.innerHTML = '<p class="text-xs text-red-500">OCR failed: ' + err.message + '</p>';
    if (btn) { btn.disabled = false; btn.innerHTML = 'Run OCR'; }
  }
};
